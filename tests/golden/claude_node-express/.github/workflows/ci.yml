# Auto-generated by coding-os `cos init` — consumer-owned (edit freely; not a symlink).
# Each leg runs the stack commands from .coding-os.yaml, so it never rots
# with tool versions; adding a stack re-renders this with the new commands.
name: CI
on:
  push:
    branches: [main]
    paths-ignore: ["docs/tasks/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  verify:
    name: verify (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: typescript
            run: '(cd src/backend && npm run lint) && (cd src/backend && npm test)'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: matrix.language == 'typescript'
        with:
          node-version: "22"
      - name: deps (typescript)
        if: matrix.language == 'typescript'
        run: |
          (cd src/backend && npm install)
      - name: verify
        run: ${{ matrix.run }}
