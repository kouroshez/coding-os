# Auto-generated by coding-os `cos init` — consumer-owned (edit freely; not a symlink).
# Body delegates to the generated make targets so it never rots with tool
# versions; adding a stack re-renders this with the new targets.
name: CI
on:
  push:
    branches: [main]
    paths-ignore: ["docs/tasks/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  verify:
    name: verify (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: typescript
            targets: "lint-backend test-backend"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: matrix.language == 'typescript'
        with:
          node-version: "20"
      - name: deps (typescript)
        if: matrix.language == 'typescript'
        run: |
          (cd src/backend && npm install)
      - name: verify
        run: make ${{ matrix.targets }}
