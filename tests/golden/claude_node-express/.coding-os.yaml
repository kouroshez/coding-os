version: '1.0'
agents:
- claude
templates:
- node-express
state_dir: .coding-os
code_extensions:
- py
- ts
- tsx
- js
- jsx
verify:
  backend: cd src/backend && npm run lint && npm test
  docs: cos doc-lint
protected_files: []
commands:
  lint-backend: cd src/backend && npm run lint
  test-backend: cd src/backend && npm test
