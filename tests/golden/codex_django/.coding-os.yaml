version: '1.0'
agents:
- codex
templates:
- django
state_dir: .coding-os
code_extensions:
- py
- ts
- tsx
- js
- jsx
verify:
  backend: cos run lint-backend && cos run test-backend
  docs: cos doc-lint
protected_files: []
commands:
  lint-backend: cd src/backend && ruff check .
  test-backend: cd src/backend && pytest -q
