version: '1.0'
agents:
- claude
templates:
- vue-nuxt
state_dir: .coding-os
code_extensions:
- py
- ts
- tsx
- js
- jsx
verify:
  frontend: cd src/frontend && npm run lint && npm test
  docs: cos doc-lint
protected_files: []
commands:
  lint-frontend: npx --yes eslint . && cd src/frontend && npm run lint
  test-frontend: cd src/frontend && npm test
  build-frontend: cd src/frontend && npm run build
