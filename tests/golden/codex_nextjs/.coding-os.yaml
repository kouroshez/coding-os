version: '1.0'
agents:
- codex
templates:
- nextjs
state_dir: .coding-os
code_extensions:
- py
- ts
- tsx
- js
- jsx
verify:
  frontend: cd src/frontend && npm run lint && npm test
  docs: cos doc-lint
protected_files: []
commands:
  lint-frontend: cd src/frontend && npm run lint
  test-frontend: cd src/frontend && npm test
