version: 1
placeholder_scan:
  extensions:
  - .md
  - .json
  - .yaml
  - .yml
  - .sh
  - .py
  - .toml
  - .txt
  file_names:
  - Makefile
  max_bytes: 262144
  root_paths:
  - AGENTS.md
  - Makefile
  - docs
  - .coding-os.yaml
  skip_paths:
  - docs/governance/_templates
  - docs/_meta
  - docs/tasks
schema:
  expected_version: 53
  expected_tables:
  - adapter_health
  - agent_metrics
  - ambiguity_violations
  - backtrack_events
  - concept_graph
  - document_chunks
  - document_chunks_fts
  - document_chunks_fts_config
  - document_chunks_fts_data
  - document_chunks_fts_docsize
  - document_chunks_fts_idx
  - embedding_outbox
  - embeddings
  - file_index_state
  - formula_dispatches
  - graph_edges_v12
  - graph_evidence_v12
  - graph_nodes
  - graph_nodes_fts
  - graph_nodes_fts_config
  - graph_nodes_fts_data
  - graph_nodes_fts_docsize
  - graph_nodes_fts_idx
  - learned_patterns
  - log_events
  - log_fingerprints
  - memory_audit
  - observations
  - outcome_history
  - pattern_validations
  - persona_selections
  - project_trajectory
  - retrieval_quality
  - retrieval_router_log
  - retrievals
  - routing_weights
  - schema_version
  - session_summaries
  - task_dependencies
  - task_edit_history
  - task_outcomes
  - task_status_history
  - tasks
  - tasks_fts
  - tasks_fts_config
  - tasks_fts_content
  - tasks_fts_data
  - tasks_fts_docsize
  - tasks_fts_idx
