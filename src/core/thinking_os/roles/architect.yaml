# Architect Role — Architecture & System Design
# Spec: docs/phase-n-role-based-routing-plan.md §2.2 · formulas-en.md Formula 3
id: architect
role_name: "Architect"
formula_ref: architect
agent_file: agents/architect.md

activation:
  primary_triggers:
    - signal: breaking_change
      equals: true
      weight: 3
    - signal: action
      in: [create, refactor]
      weight: 2
    - signal: scope_size
      in: [medium, large, recursive]
      weight: 2
    - signal: has_production_impact
      equals: true
      weight: 2
  secondary_triggers:
    - signal: action
      equals: modify
      weight: 1
    - signal: domain
      contains: [db, backend, infra]
      weight: 1
  deactivators:
    - signal: action
      equals: research
      weight: 3
    - signal: action
      equals: document
      weight: 2
    - signal: scope_size
      equals: trivial
      weight: 3
  min_score: 3

intensity_steps:
  light:    [1, 2]
  standard: [1, 2, 3, 4, 5, 6]
  full:     [1, 2, 3, 4, 5, 6]

tools_budget:
  - cos_graph_query
  - cos_graph_impact
  - cos_graph_contracts
  - cos_doc_search
  - cos_search
  - Read
  - Grep
max_tokens_in: 8000
max_tokens_out: 4000
timeout_s: 120

model_pref:
  complicated: sonnet
  complex: opus

output_schema: cognition_schemas.ArchitectOutput

backtrack_triggers:
  - signal_phrase_regex: "(missing|unknown) actor"
    target: analyst
    reason_template: "Architect encountered missing actor — backtrack to Analyst actor map"
  - signal_phrase_regex: "undefined (capability|requirement)"
    target: analyst
    reason_template: "Architect needs defined capability from Analyst"
  - signal_phrase_regex: "(no|missing) (prior art|research|landscape)"
    target: researcher
    reason_template: "Architect needs research landscape — backtrack to Researcher"

criteria_required:
  step_1: [scoped, measurable, testable]
  step_2: [scoped, reversible_or_justified, owned]
  step_3: [scoped, testable, observable]
  step_4: [observable, testable, scoped]
  step_5: [scoped, owned, reversible_or_justified]
  step_6: [scoped, observable, owned]

prompt_prefix: |
  You are in the Architect role. Your job is to produce NFRs, select
  pattern & tech, design DB schema, define API contracts, make
  infrastructure decisions, and record ADRs. You are NOT implementing —
  that is the Implementer role. You are NOT researching options in isolation — that was the Researcher.
  You are NOT defining scenarios — that was the Analyst. Output strict ArchitectOutput JSON.
