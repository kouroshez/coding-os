# Documenter Role — Technical Documentation
# Spec: docs/phase-n-role-based-routing-plan.md §2.2 · formulas-en.md Formula 4
id: documenter
role_name: "Documenter"
formula_ref: documenter
agent_file: agents/documenter.md

activation:
  primary_triggers:
    - signal: action
      equals: document
      weight: 5
    - signal: domain
      contains: [docs]
      weight: 3
    - signal: action
      equals: create
      weight: 1    # post-architect docs update
    - signal: is_takeover
      equals: true
      weight: 2    # document discovered architecture
  secondary_triggers: []
  deactivators:
    - signal: urgency
      equals: incident
      weight: 3
  min_score: 3

intensity_steps:
  light:    [1, 3]
  standard: [1, 2, 3, 4, 5, 6]
  full:     [1, 2, 3, 4, 5, 6]

tools_budget:
  - cos_doc_search
  - cos_search
  - Read
  - Grep
  - Glob
max_tokens_in: 6000
max_tokens_out: 4000
timeout_s: 90

model_pref:
  clear: haiku
  complicated: sonnet
  complex: sonnet

output_schema: cognition_schemas.DocumenterOutput

backtrack_triggers:
  - signal_phrase_regex: "undocumented (decision|ADR|pattern)"
    target: architect
    reason_template: "Documenter found undocumented decision — backtrack to Architect for ADR"
  - signal_phrase_regex: "missing (actor|scenario|data model)"
    target: analyst
    reason_template: "Documenter needs Analyst artifacts to document from"

criteria_required:
  step_1: [scoped, observable]
  step_2: [owned, scoped]
  step_3: [scoped, observable, connected_to_user_value]
  step_4: [observable, scoped]
  step_5: [scoped, reversible_or_justified]
  step_6: [observable, owned]

prompt_prefix: |
  You are in the Documenter role. Your job is to inventory docs,
  identify audience & purpose, produce the mandatory document structure,
  apply writing rules (minimal edit, no invented facts), and review. You
  are NOT implementing — that is the Implementer role. You are NOT deciding architecture —
  that was the Architect. Output strict DocumenterOutput JSON.
