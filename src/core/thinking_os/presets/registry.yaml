# Phase N — Formula-Chain Presets (curated)
# Spec: docs/phase-n-role-based-routing-plan.md §2.4
# Selection: match_preset() returns the preset with highest `score` among
# those whose `match` block is fully satisfied by TaskSignals. The
# effective preset_min_score is read from .coding-os/config.yaml
# (cognition.preset_min_score, default 8, range 0-15 per §7-locked decision 2).
#
# NOTE: this file is hashed (sha256) on load and the hash is stamped into
# every session's ComposedChain.preset_version (N.5-C preset versioning)
# so mid-session edits don't change an in-flight chain.

presets:
  - id: greenfield-backend-api
    rationale: "Standard bootstrap for a new backend service — research, analyze, architect, document, implement, verify."
    match:
      action: create
      domain_any: [backend, api]
      novelty_gte: 0.4
      scope_size_in: [medium, large]
    chain: [researcher, analyst, architect, documenter, implementer, reviewer]
    score: 10

  - id: greenfield-frontend-feature
    rationale: "New frontend feature with clear scope — analyze + implement + review. No architecture phase for small features."
    match:
      action: create
      domain_any: [frontend]
      scope_size_in: [small, medium]
    chain: [analyst, implementer, reviewer]
    score: 8

  - id: schema-migration
    rationale: "Breaking schema change — must go through analysis + architecture + security (data protection) before implementing."
    match:
      action: modify
      breaking_change: true
      domain_any: [db, backend]
    chain: [analyst, architect, security_auditor, implementer, reviewer]
    score: 10

  - id: production-bug-mitigate
    rationale: "Incident response — restore service first, root-cause after. Follows formulas-en.md §Incident Response."
    match:
      urgency: incident
    chain_before: ["mitigate", "communicate"]
    chain: [debugger, reviewer]
    chain_after: ["post_mortem", "update_observer"]
    score: 12

  - id: security-audit-full
    rationale: "Full 5-layer security audit, layers dispatched in parallel."
    match:
      action: audit
      domain_any: [security, auth]
    chain: [security_auditor]
    parallel: true
    parallel_layers: [L1, L2, L3, L4, L5]
    score: 10

  - id: legacy-takeover
    rationale: "Existing project takeover — reverse-engineer, stabilize with characterization tests, then evolve."
    match:
      is_takeover: true
    chain: [analyst, reviewer, documenter, implementer, reviewer, refactorer, architect]
    chain_notes:
      analyst: "reverse mode — derive problem definition from existing code"
      reviewer: "characterization tests before changing anything"
    score: 11

  - id: external-integration
    rationale: "Adding a third-party service (Stripe, Twilio, OAuth, etc.) — mini research, integration scenarios, contract design, implement, test, security review."
    match:
      action: create
      external_dependency: true
    chain: [researcher, analyst, architect, implementer, reviewer, security_auditor]
    score: 9

  - id: refactor-sprint
    rationale: "Planned refactoring cycle — identify debt, re-evaluate architecture, execute, verify."
    match:
      action: refactor
    chain: [refactorer, architect, implementer, reviewer]
    score: 9

  - id: docs-only-update
    rationale: "Pure documentation task — Documenter only."
    match:
      action: document
      domain_any: [docs]
    chain: [documenter]
    score: 9

  - id: debug-standard
    rationale: "Non-incident bug — reproduce, isolate, fix, regression-test, update docs."
    match:
      action: debug
      urgency_in: [normal, elevated]
    chain: [debugger, reviewer, documenter]
    score: 8

  - id: deploy-release
    rationale: "Planned release — security gate, deployment, monitoring update."
    match:
      action: deploy
    chain: [security_auditor, deployer, observer]
    score: 9

  - id: research-spike
    rationale: "Pure research task — Researcher only, no implementation."
    match:
      action: research
    chain: [researcher]
    score: 8

  - id: audit-exhaustive
    rationale: "Audit-shape task with exhaustive intent (TASK-004 G2). Inventory categories (researcher), enumerate evidence plan (analyst), per-category sweep + fix (implementer), independent re-verify (reviewer), capture artifact (documenter). The chain mirrors the audit-checklist-template structure so every role contributes one column to the evidence table. Reviewer phase is mandatory — the auto-reviewer hint (G6) on cos_task_move complete spawns an Explore subagent that posts back ExhaustiveEvidence.reviewer_check=pass before the completion guardian (G4) will allow Stop."
    match:
      action: audit
      exhaustive: true
    chain: [researcher, analyst, implementer, reviewer, documenter]
    chain_notes:
      researcher: "inventory every category the exhaustive vocabulary implies — do not stop at the obvious ones"
      analyst: "per category produce {pattern, files_to_scan, expected_count_before, expected_count_after}"
      implementer: "per category fix-then-re-grep loop until count_after=0; record both numbers in audit table"
      reviewer: "independent re-grep on top-3 categories by count_before; mismatch → ABORT"
      documenter: "fill audit-<slug>.md frontmatter + Closing Checklist; submit ExhaustiveEvidence"
    score: 11

# Config reference — effective threshold is read from .coding-os/config.yaml
# at router load time. Each ComposedChain records the threshold used so
# observability can tune per-team.
defaults:
  preset_min_score: 8
  min_score_range: [0, 15]
