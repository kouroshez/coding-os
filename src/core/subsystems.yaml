# Subsystem (module) registry — TASK-349. VSCode-style modularity: the kernel
# is always on; optional modules toggle per project via the state API
# (cli/subsystems.py → $COS_STATE_DIR/subsystems-state.json).
#
# Every hook id below MUST exist in src/core/hooks/registry.yaml
# (tests/test_cli.py::TestSubsystems cross-validates). Safety-category hooks
# are non-disableable regardless of module membership (TASK-256 layer);
# `kernel: true` additionally pins the whole module.
#
# Schema: id, label, hint, kernel, hooks[], tools[], skills[], commands[], rules[], depends_on[], hidden.
# `hint` = one-line "when to enable" surfaced in the Hub Config → Modules tab (discovery UX).
# `tools` trailing '*' = MCP prefix family (tools/_shared.py gate).
# `commands` = slash-command stems (core/commands/<name>.md) UNAMBIGUOUSLY owned
# by this module; disabling it unlinks them from the adapter commands dir
# (ref-counted) via module_commands.cascade_module_commands (TASK-481). Always-on
# commands (classify/verify/review/diagnose/new-project) are never listed.
# `skills` = domain-skill names UNAMBIGUOUSLY owned by this module; disabling it
# unlinks them (ref-counted, override-aware) via skill_commands.cascade_module_skills
# (TASK-475). Always-on skills (clean-code, thinking_os, search) are never listed.
# `rules` = core rule filenames (src/core/rules/<name>.md) UNAMBIGUOUSLY owned by
# this module; disabling it unlinks them from the adapter rules dir (ref-counted)
# via module_commands.cascade_module_rules. Cross-cutting rules (git-workflow,
# anti-overengineering, api-contract-discipline, thinking_os, transparency-banner,
# test-discipline) and derived rules (dimension-registry, skill-enforcement) are
# never listed. A disabled module's rule also self-guards as inert (defense-in-depth).
# `hidden: true` keeps a reserved id stable but drops it from every toggle UI.
version: 1

# Profiles (TASK-509): named curated module sets for `cos init --profile <name>`.
# Each profile lists the modules it DISABLES (everything else stays on); the
# resolver feeds that union through the existing --disable-module path into
# subsystems-state.json. Progressive disclosure / least-surface-by-default — a
# fresh consumer gets a leaner MCP tool surface; `full` is the all-on escape
# (byte-identical to a no-profile init). Disabled lists must stay dependency-safe
# (never drop a module another profile-enabled module depends on).
default_profile: standard
profiles:
  lite: { disabled: [docs, tasks, graph, memory, cognition, observability, hub-extras, cicd] }  # kernel-only: discipline + safety, ~zero MCP tools (MCP-averse adopters)
  core: { disabled: [memory, cognition, observability, cicd] }   # kernel + docs + tasks + graph + hub-extras
  standard: { disabled: [cognition, cicd] }                      # + memory + observability (default)
  full: { disabled: [] }                                         # everything (today's behaviour)

modules:
  - id: kernel
    label: "Kernel — state, env, session lifecycle + always-on safety/enforcement discipline"
    hint: "Always on — lifecycle + the non-negotiable safety/enforcement discipline surface."
    kernel: true
    # Lifecycle + the non-negotiable discipline surface. Safety-category hooks
    # are non-disableable regardless of module (project_overrides filters them);
    # pinning enforcement + meta-governance here makes the registry↔module map
    # total so every hook has an owner (audit F9), with none toggleable-away.
    hooks:
      - session-context
      - session-end
      - classify-task-mode
      - agent-presence
      - track-skill
      - inject-mcp-caller-session
      # safety (never disableable — category-gated in project_overrides)
      - block-secrets
      - block-dangerous-commands
      - block-bad-patterns
      - block-hardcoded-literals
      - block-migration-conflict
      - block-protected-files
      - block-uv-heredoc
      - check-mcp-extras
      - enforce-task-transition
      - enforce-wip-limit
      - lint-task
      - validate-task-frontmatter
      # core enforcement discipline (always on)
      - branch-guard
      - block-shared-tree-edit
      - pr-reap
      - nudge-git-mode
      - enforce-commit-message
      - enforce-scaffold-boundary
      - enforce-skill
      - enforce-template
      - enforce-verify
      - enforce-zoom
      - search-enforce-inventory
      - search-verify-remaining
      - test-governor
      - thinking_os-gate
      # meta-repo governance (coding-os-internal; no-ops in consumers)
      - check-agents-md-refs
      - check-agents-md-size
      - remind-dogfood
      - warn-destructive-edit
      - warn-diff-size
    # Always-on tools that match no module pattern, so the gate never removes them
    # (auditable floor — the tool gate skips kernel by design). cos_classify_prompt
    # (Record Gate) + cos_health (diagnostic) are kernel by design; cos_traceability
    # is cross-cutting; cos_failure_pattern_query reads cognition-populated data and
    # is a candidate to move to `cognition` later (rank-11 follow-up).
    tools: [cos_classify_prompt, cos_health, cos_traceability, cos_failure_pattern_query]
    depends_on: []

  - id: docs
    label: "Docs system — SSOT docs, doc search, doc hygiene"
    hint: "Enable for SSOT doc search (cos_doc_*) + the doc-anchor / docs-first discipline."
    kernel: false
    hooks: [enforce-doc-anchor, enforce-doc-sync, nudge-docs-first, check-doc-size, auto-regen-doc-index, auto-reindex-docs]
    tools: ["cos_doc_*"]
    depends_on: []

  - id: tasks
    label: "Task system — Scrumban board, lifecycle, work logs"
    hint: "Enable for the Scrumban board, task lifecycle gates, and work logs (cos_task_*)."
    kernel: false
    hooks: [enforce-task-start, enforce-task-body, enforce-task-readiness, nudge-task-discovery, warn-abandoned-task, nudge-reentry, remind-daily, auto-task-sync, sync-task-current, link-commit-to-task, reclaim-sweep, capture-work-log]
    tools: ["cos_task_*", cos_work_log_append]
    skills: [task-driver]
    commands: [board, daily, retro, task]
    # tasks→docs is NOT a code dependency (board_os imports nothing from docs); it
    # is enforcement-locality — the docs-first code-write BLOCK gate (enforce-doc-anchor)
    # lives in the docs module and consumes each task's Read First, so tasks-on/docs-off
    # would silently strip that gate. Keep hard.
    depends_on: [docs]
    depends_on_reason: "Enforcement-locality: the docs-first code-write gate (enforce-doc-anchor) lives in the docs module and consumes each task's Read First — tasks-on/docs-off would silently strip that gate."

  - id: graph
    label: "Knowledge graph — code/doc graph, structural queries"
    hint: "Enable for structural code/doc queries — callers, blast radius, rename (cos_graph_*)."
    kernel: false
    hooks: [enforce-graph-context, enforce-graph-first-read, enforce-rename-plan, nudge-graph-os, warn-graph-empty, verify-rename-callers, auto-graph-reconcile-shell]
    tools: ["cos_graph_*"]
    skills: [graph-explorer, graph-os-authoring]
    depends_on: []

  - id: memory
    label: "Agent memory — observations, learning, recall"
    hint: "Enable for cross-session recall + the learning loop (cos_search, cos_learn_*)."
    kernel: false
    hooks: [enforce-memory-check, capture-observation, jit-recall, nudge-learn-narrative, remind-learn-validate, auto-brain-decay, drain-embedding-outbox, check-capture-worked, ensure-agent-memory-link, sync-agent-memory]
    tools: [cos_search, cos_observation_record, cos_timeline, cos_details, "cos_learn_*", "cos_retrieval_*", cos_promote, cos_digest_regenerate]
    skills: [agent-memory]
    commands: [memory-search]
    rules: [memory.md]
    depends_on: []

  - id: cognition
    label: "Cognition — role composition, reasoning primers + workflow nudges"
    hint: "Enable for role-chain composition + reasoning primers (adds per-session token cost)."
    kernel: false
    # The optional reasoning-assist surface: session primers, role chain
    # composition, and soft nudges. Toggle off to cut the per-session token
    # cost of the cognitive scaffolding (hard gates stay in kernel).
    hooks: [advance-role, auto-compose-roles, auto-dispatch-crossprovider, enforce-anti-ambiguity, nudge-humanizer, nudge-model-routing, resolve-supervise-route, nudge-thinking-os, rules-primer, session-skill-primer, track-backtrack, track-discovery, nudge-reuse-first, regen-reminder, test-first-reminder]
    # The reasoning-assist tool surface: role composition, formula dispatch,
    # supervision, model/skill routing, situation detect. cos_classify_prompt
    # (Record Gate, core loop) + cos_health (diagnostic) stay KERNEL by design.
    tools: ["cos_dispatch_*", "cos_route_*", cos_compose_chain, cos_supervise, cos_supervise_record_output, cos_supervision_config, cos_role_info, cos_situation_detect, cos_takeover, cos_analyze_task, cos_ambiguity_check, cos_backtrack_log, cos_discovery]
    # /compose is the role-chain composition surface; /role-* commands map from
    # thinking_os/agents/ (a separate source) and stay always-on (Rule 22 — not
    # worth the agents/ source-mapping to gate a low-frequency advanced surface).
    commands: [compose]
    rules: [model-routing.md]
    depends_on: []

  - id: observability
    label: "Observability — session tracing, transcript + tool-failure capture"
    hint: "Enable for session tracing, metrics, and tool-failure / transcript capture (cos_metric_*)."
    kernel: false
    hooks: [auto-trace-rotate, capture-tool-failure, record-verify-auto, snapshot-transcript]
    # Session metrics, log query, trajectory snapshots, presence. Internal
    # callers (task-done outcome recording, hooks) use the impl functions, not
    # these MCP tools, so gating is surface-only — it never breaks recording.
    tools: ["cos_metric_*", "cos_trajectory_*", cos_log_query, cos_presence_query]
    depends_on: []

  - id: hub-extras
    label: "Hub extras — web UI conveniences beyond the API core"
    hint: "Enable for web-UI conveniences (ensure-hub-up, MCP-down banner) beyond the API core."
    kernel: false
    hooks: [ensure-hub-up, warn-mcp-down]
    tools: []
    depends_on: []

  - id: cicd
    label: "CI/CD — generated GitHub Actions workflow + backend Dockerfiles"
    hint: "Enable to render a GitHub Actions workflow + backend Dockerfiles at init/update."
    kernel: false
    # Owns no hooks/tools: it gates the .github/workflows/ci.yml render at init
    # and update (cli.main / cli.update → materialize_ci_workflow). Off in the
    # lean profiles; `--profile full` or an explicit enable turns it on.
    hooks: []
    tools: []
    depends_on: []

  # Roadmap module (TASK-372 / ADR-0008): the visual Design surface. Registered
  # so the id is reserved, but hidden from the toggle UI until it ships hooks/
  # tools — a live Enable/Disable on an empty module is a no-op footgun (F10).
  - id: design
    label: "Design — visual design surface (roadmap)"
    kernel: false
    hooks: []
    tools: []
    depends_on: []
    hidden: true
