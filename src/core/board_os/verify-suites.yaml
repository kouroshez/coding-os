# Verify Suites — data-driven mapping from changed paths → required test commands.
#
# SSOT for the AGENTS.md verification matrix. Replaces the hardcoded
# customer-specific paths (frontend/app/*/checkout/*, backend/, etc.)
# that used to live in src/core/hooks/enforce-verify.sh.
#
# Schema:
#   suites: name → { paths: [glob], command: str, max_age_seconds: int? }
#   project_overrides: optional consumer-specific extensions loaded from
#     `${COS_PROJECT_ROOT}/.coding-os/verify-suites.yaml` if present, deep-merged.
#
# See docs/phase-l10-plan.md.

version: 1

suites:
  test-thinking_os:
    paths:
      - "src/core/thinking_os/**/*.py"
    # -m 'not slow' skips test_background.py (74% of suite wall-clock,
    # measured 2026-06-09); slow set runs via `make test-slow` pre-merge.
    command: "uv run --extra rag pytest src/core/thinking_os/tests/ -q -m 'not slow'"

  test-board_os:
    paths:
      - "src/core/board_os/**/*.py"
    command: "uv run --extra rag --with aiohttp --with pytest-asyncio pytest src/core/board_os/tests/ -q"

  test-graph_os:
    paths:
      - "src/core/graph_os/**/*.py"
    command: "uv run --extra graph_os pytest src/core/graph_os/tests/ -q"

  # Shipped runtime subsystems (in CI on every PR) that previously had NO
  # verify-suite entry — an agent edit recorded no PASS/FAIL and got zero
  # matrix gate (audit F-TST-1). Commands mirror the ci.yml subsystem steps.
  test-logging_os:
    paths:
      - "src/core/logging_os/**/*.py"
    command: "uv run --extra rag pytest src/core/logging_os/tests/ -q"

  test-scheduled:
    paths:
      - "src/core/scheduled/**/*.py"
    command: "uv run --extra rag pytest src/core/scheduled/tests/ -q"

  # Hub SPA (vitest). Command is `make ui-test`, NOT a raw npm: record-verify-auto.sh
  # only records suites whose command matches a make/pytest verb, so a bare npm
  # run would never satisfy the gate it triggers (it would deadlock the close).
  test-web-ui:
    paths:
      - "src/core/web/ui/**/*.ts"
      - "src/core/web/ui/**/*.tsx"
    command: "make ui-test"

  verify-hooks:
    paths:
      - "src/core/hooks/*.sh"
      - "src/core/scripts/*.sh"
      - "src/core/hooks/registry.yaml"
    command: "make verify-hooks"

  test-cli:
    paths:
      - "src/cli/*.py"
    command: "uv run pytest tests/test_cli.py -q"

  # The module registry is a cross-artifact SSOT: subsystems.yaml maps every
  # hook/tool/skill/command to a module, and registry.yaml is its hook source.
  # An edit to either must run the totality + profile invariants — a hook/tool
  # added to registry without a module owner (F9) or a profile whose disabled
  # set drifts from the yaml is caught here, not on a full sweep. registry.yaml
  # matches both this and verify-hooks (match_suites returns all matches).
  test-modules:
    paths:
      - "src/core/subsystems.yaml"
      - "src/core/hooks/registry.yaml"
    command: "uv run pytest tests/test_cli.py::TestSubsystems tests/test_module_gating_smoke.py -q"

  test-adapters:
    paths:
      - "src/adapters/**"
    command: "uv run pytest tests/test_adapters.py tests/test_adapter_parity.py -q"

  test-template-scaffold:
    paths:
      - "src/templates/**/scaffold/**"
    command: "uv run pytest tests/test_template_scaffold.py -q"

  docs-lint:
    paths:
      - "docs/**/*.md"
      - "AGENTS.md"
      - "CLAUDE.md"
    command: "make docs-lint"

  # Optional consumer-side suites (no paths in meta-repo; consumer
  # project's verify-suites.yaml typically reuses the suite name and
  # specifies its own paths/command).
  test-backend:
    paths:
      - "backend/**"
    command: "make test-backend"
  test-frontend:
    paths:
      - "frontend/**"
    command: "make test-frontend"

# How long a recorded PASS counts as fresh.
defaults:
  max_age_seconds: 1800
