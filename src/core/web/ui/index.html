<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Coding OS</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/cos-board-tokens.css" />
  </head>
  <body class="min-h-screen">
    <!-- Instant first-paint placeholder: the ~1MB JS bundle takes a beat to
         download + parse, and an empty #root rendered a blank, unstyled screen
         (TASK-291). This inline markup paints immediately (no bundle needed) on
         the themed canvas from cos-board-tokens.css; createRoot().render()
         clears #root and replaces it on mount. Inline styles only — the Tailwind
         bundle isn't loaded yet at this point. -->
    <div id="root">
      <div id="cos-boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--surface-canvas,#0a0b0e);color:var(--text-2,#a4abb8);font-family:'Inter',system-ui,sans-serif">
        <img src="/favicon.png" alt="" width="40" height="40" style="border-radius:9px;animation:cos-boot-pulse 1.4s ease-in-out infinite" />
        <div style="font-size:13px;letter-spacing:.02em">Loading Coding OS…</div>
        <div style="width:96px;height:3px;border-radius:3px;overflow:hidden;background:var(--surface-raised,#171a20)">
          <div style="width:40%;height:100%;border-radius:3px;background:var(--brand,#5a5fe0);animation:cos-boot-slide 1.1s ease-in-out infinite"></div>
        </div>
      </div>
    </div>
    <style>
      @keyframes cos-boot-pulse { 0%,100%{opacity:.55} 50%{opacity:1} }
      @keyframes cos-boot-slide { 0%{transform:translateX(-120%)} 100%{transform:translateX(360%)} }
      @media (prefers-reduced-motion: reduce) {
        #cos-boot img, #cos-boot div div { animation: none !important }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
