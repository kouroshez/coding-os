# RAG indexer configuration — base scaffold (stack-agnostic defaults).
#
# Inherited by every consumer project from `cos init`. Stack overlays
# may append additional sources or graph.enforce_context_on globs for
# stack-specific load-bearing files.
#
# Edit and run `make docs-index` to apply.
#
# Source schema:
#   - path: relative to project root (missing dirs silently skipped)
#     type: short label used by cos_doc_search filter
#     chunk_size: max chars per chunk (default 2000 ≈ 500 tokens)
#     chunk_overlap: overlap between adjacent chunks (default 200)
#     priority: ranking boost in [0.0, 1.0] (default 0.5)
#     exclude: optional list of subpaths relative to `path`

sources:
  - path: docs/prd/
    type: prd
    chunk_size: 2000
    chunk_overlap: 200

  - path: docs/architecture/
    type: architecture
    exclude:
      - adr/   # ADRs handled below as their own source

  - path: docs/architecture/adr/
    type: adr
    chunk_size: 4000   # ADRs are short — usually one chunk per ADR fits

  - path: docs/api-contracts/
    type: api_contract

  - path: docs/engineering/
    type: engineering
    priority: 0.7      # Engineering rules are high-actionability — boost ranking

  - path: docs/ops/
    type: ops

  - path: docs/insights/
    type: insight
    priority: 0.8      # High-signal lessons filed back by cos_learn_narrative

  - path: docs/workflow/
    type: workflow
    priority: 0.6      # SSOT references for src/core/rules/*.md (thinking_os, etc.)

# Project-level excludes — paths under here are NEVER indexed regardless of source.
exclude:
  - docs/playbooks/      # Playbooks are routing logic — full-read as skill
  - docs/governance/     # Always-active rules
  - docs/tasks/          # Task files surfaced via cos_task_* family
  - docs/00-index.md     # Navigation hub
  - docs/_meta/          # Nav/index meta — not content
  # docs/workflow/ is INDEXED by default — holds SSOT references like
  # thinking_os-final-edition.md that src/core/rules/thinking_os.md points to.
  # Remove the file paths from `sources` below to opt-out per-project.

# ── Graph enforcement (Phase I.14) ────────────────────────────────────
# Files matching these globs are "load-bearing" — editing them without a
# prior cos_graph_context call triggers enforce-graph-context.sh (default
# warn; promote to block via COS_ENFORCE_GRAPH_CONTEXT=strict). Empty in
# the base scaffold — stack overlays append their own globs (e.g. a
# nextjs overlay adds `*src/app/**/*.tsx`).
graph:
  enforce_context_on: []
