# Scrumban board configuration (base default).
# Per-stack overrides ship in src/templates/<stack>/scaffold/.coding-os/.
# See docs/phase-l-scrumban-task-system-plan.md §6.1.1 + §17 (Multi-Repo).
#
# Four categorization axes for tasks:
#   swimlane = domain (rows on the board) — defined HERE
#   kind     = work type (card colour) — closed enum, NOT configurable
#   epic     = initiative (optional badge) — free string
#   labels   = free tags — must NOT overlap kind enum

swimlanes:
  - id: backend
    label: "Backend"
    color: "#3b82f6"
    description: "Server-side logic, API, persistence"
  - id: frontend
    label: "Frontend"
    color: "#22c55e"
    description: "UI, components, client-side"
  - id: docs
    label: "Documentation"
    color: "#a855f7"
    description: "Docs, ADRs, READMEs"
  - id: infra
    label: "Infrastructure"
    color: "#78716c"
    description: "DevOps, CI/CD, deployment"

# WIP caps (perfectionism defense for solo dev; teams may raise).
wip_limits:
  in_progress: 1   # do one thing at a time
  testing: 3
  emergency: 2

# State-machine policy gates + multi-agent WIP behavior.
workflow_policy:
  # Require the `ready` label before icebox→in_progress (emergency exempt).
  require_ready_label: true
  # Block in_progress→complete; force routing through `testing`.
  block_in_progress_to_complete: true
  # Block icebox→in_progress while any depends_on task is not `complete`
  # (retryable conflict; force/emergency bypass). cos_task_pick also omits
  # cards with an incomplete dependency, so the picker surfaces runnable work.
  require_deps_complete: true
  # Count the in_progress cap per agent_session so concurrent sessions
  # don't block each other on a global cap (testing/emergency stay global).
  per_session_wip: true
  # An in_progress task idle this long whose owner session is inactive is
  # a zombie-reclaim candidate (cos_task_reclaim → icebox+ready).
  reclaim_idle_hours: 24
  # Per-status reclaim window — `testing` parks near-done work, so a stranded
  # testing zombie is reclaimed sooner than a generic in_progress one and is
  # routed back to in_progress (0 = fall back to reclaim_idle_hours).
  testing_reclaim_idle_hours: 6
  # SLA dwell budgets — a card past its budget is flagged `stale` on every
  # board surface (cos board / daily — observability only, no mutation).
  # 0 disables the flag for that status.
  in_progress_sla_hours: 24
  testing_sla_hours: 6
  icebox_stale_days: 30
  # Auto-archive aged cards on a timer (SessionStart + nightly sweeps); a
  # `keep`/`parked` label always exempts, and archive is reversible (archive→icebox).
  #   icebox  = 0 (OFF): never silently retire unstarted backlog.
  #   complete = 30: finished work older than a month auto-archives so the COMPLETE
  #              column stays bounded to recent work (done + reversible = safe).
  icebox_auto_archive_days: 0
  complete_auto_archive_days: 30

# Optional extra label families (kind colours are fixed, NOT here).
# Custom labels not in this list still work — they get a deterministic
# hash-based colour, but no emoji.
label_families: []
