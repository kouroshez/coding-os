# Scaffold boundary for the nestjs stack.
# Schema: docs/governance/scaffold-boundary-contract.md

version: 1
stack: nestjs

roots:
  - src/backend/

file_patterns:
  - "src/backend/**/*.ts"
  - "src/backend/**/*.json"

imports_from:
  - src/shared/
  - src/shared/types/
  - src/shared/contracts/

forbids_writing_in:
  - src/frontend/
  - src/mobile/

notes:
  - "Controllers thin; providers own logic; repositories own data access."
  - "One global exception filter is the only error-response shaper."
