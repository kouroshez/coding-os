version: 1
id: spring-boot
language: java
label: "Spring Boot + Java"
category: backend

structure:
  root: src/backend
  tree: |
    src/backend/
    ├── pom.xml
    └── src/main/java/com/example/app/
        ├── Application.java        # SpringApplication bootstrap (no business logic)
        ├── common/                 # cross-cutting: the global @RestControllerAdvice error shaper
        │   └── GlobalExceptionHandler.java
        └── <feature>/              # one package per domain
            ├── <Feature>Controller.java   # thin — maps routes, delegates to the service
            └── <Feature>Service.java      # business logic (the only layer that thinks)
  notes: "controllers thin, services own logic; one @RestControllerAdvice is the ONLY error-response shaper; DTOs validated with @Valid + Bean Validation before reaching a service; DI via constructor injection, never `new` a bean"
primary_skill: spring-boot
skills: [spring-boot]

substitutions:
  DOMAIN_ROUTES: "Backend→`docs/playbooks/spring-boot-service.md`"
  SKILL_ROUTES: "Backend→`spring-boot`"
  ENGINEERING_RULE_ROUTING: "Backend→`docs/engineering/spring-boot-rules.md`, Error format→`docs/api-contracts/error-format.md`"
  TOOL_ROUTING_IMPL: "`lint-backend`, `test-backend`"
  VERIFY_BACKEND_GLOB: "`src/backend/`"
  VERIFY_BACKEND_SUITES: "lint-backend + test-backend"
  VERIFY_BACKEND: "`cd src/backend && ./mvnw -q verify`"
  QUICK_ROUTING: |-
    - Spring Boot controller / service task → [Spring Boot Service Playbook](./playbooks/spring-boot-service.md)
    - @RestControllerAdvice / DI / @Valid DTO validation → [Spring Boot Service Playbook](./playbooks/spring-boot-service.md)
  STACK_REF_CODES: |-
    - `REF:PLAYBOOK-SPRING` → `./playbooks/spring-boot-service.md`
    - `REF:SPRING-RULES` → `./engineering/spring-boot-rules.md`

ref_codes:
  - {code: "REF:PLAYBOOK-SPRING", path: "./playbooks/spring-boot-service.md", desc: "Spring Boot service playbook"}
  - {code: "REF:SPRING-RULES",    path: "./engineering/spring-boot-rules.md", desc: "Spring Boot engineering rules"}

routing_entries:
  - "Spring Boot controller / service task → [Spring Boot Service Playbook](./playbooks/spring-boot-service.md)"

rules:
  - {file: rules/backend.md, globs: ["src/backend/**/*.java"]}

makefile_targets:
  - {name: lint-backend, cmd: "cd src/backend && ./mvnw -q -DskipTests spotless:check"}
  - {name: test-backend, cmd: "cd src/backend && ./mvnw -q test"}

verify:
  - {glob: "src/backend/**/*.java", suites: "lint-backend + test-backend", cmd: "cd src/backend && ./mvnw -q verify"}

dimensions:
  - {name: "Spring Boot controller",   read_files: ["docs/playbooks/spring-boot-service.md", "docs/engineering/spring-boot-rules.md"]}
  - {name: "Service / business logic", read_files: ["docs/engineering/spring-boot-rules.md"]}
  - {name: "Repository / persistence", read_files: ["docs/engineering/spring-boot-rules.md"]}
  - {name: "DTO validation",           read_files: ["docs/engineering/spring-boot-rules.md", "docs/api-contracts/error-format.md"]}
  - {name: "Security / authorization", read_files: ["docs/engineering/spring-boot-rules.md"]}

skill_enforcement:
  - {globs: ["src/backend/**/*.java"], primary: spring-boot, secondary: [clean-code, backend-fundamentals, api-design, auth-patterns, security-web, testing-strategy, observability]}
  - {globs: ["src/backend/**/*Repository.java", "src/backend/**/repository/**/*.java", "src/backend/**/*Entity.java"], primary: spring-boot, secondary: [clean-code, db-design, backend-fundamentals]}
  - {globs: ["src/backend/**/*SecurityConfig.java", "src/backend/**/security/**/*.java", "src/backend/**/Auth*.java"], primary: spring-boot, secondary: [auth-patterns, security-web, clean-code]}
