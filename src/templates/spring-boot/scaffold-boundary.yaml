# Scaffold boundary for the spring-boot stack.
# Schema: docs/governance/scaffold-boundary-contract.md

version: 1
stack: spring-boot

roots:
  - src/backend/

file_patterns:
  - "src/backend/**/*.java"
  - "src/backend/**/*.xml"
  - "src/backend/**/*.properties"
  - "src/backend/**/*.yml"

imports_from:
  - src/shared/
  - src/shared/contracts/

forbids_writing_in:
  - src/frontend/
  - src/mobile/

notes:
  - "Controllers thin; services own logic; repositories own data access."
  - "One @RestControllerAdvice is the only error-response shaper."
