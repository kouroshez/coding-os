version: 1
id: aspnet-core
language: csharp
label: "ASP.NET Core + C#"
category: backend

structure:
  root: src/backend
  tree: |
    src/backend/
    ├── Backend.sln             # solution (app + test projects); verify targets this
    ├── Backend.csproj
    ├── Program.cs              # WebApplication bootstrap (no business logic)
    ├── Common/                 # cross-cutting: exception middleware, problem shaper
    │   └── ExceptionHandlingMiddleware.cs
    ├── Features/               # one folder per domain
    │   └── <Feature>/
    │       ├── <Feature>Endpoints.cs   # thin — maps routes, delegates to the service
    │       └── <Feature>Service.cs     # business logic (the only layer that thinks)
    └── tests/                  # xUnit project (Backend.Tests) — bootable green test
        └── Backend.Tests/
  notes: "endpoints/controllers thin, services own logic; one global exception-handling middleware is the ONLY error-response shaper; DTOs validated before reaching a service; DI via the built-in container, never `new` a service"
primary_skill: aspnet-core
skills: [aspnet-core]

substitutions:
  DOMAIN_ROUTES: "Backend→`docs/playbooks/aspnet-core-service.md`"
  SKILL_ROUTES: "Backend→`aspnet-core`"
  ENGINEERING_RULE_ROUTING: "Backend→`docs/engineering/aspnet-core-rules.md`, Error format→`docs/api-contracts/error-format.md`"
  TOOL_ROUTING_IMPL: "`lint-backend`, `test-backend`"
  VERIFY_BACKEND_GLOB: "`src/backend/`"
  VERIFY_BACKEND_SUITES: "lint-backend + test-backend"
  VERIFY_BACKEND: "`cd src/backend && dotnet format Backend.sln --verify-no-changes && dotnet test Backend.sln`"
  QUICK_ROUTING: |-
    - ASP.NET Core endpoint / controller task → [ASP.NET Core Service Playbook](./playbooks/aspnet-core-service.md)
    - Middleware / DI / DTO validation → [ASP.NET Core Service Playbook](./playbooks/aspnet-core-service.md)
  STACK_REF_CODES: |-
    - `REF:PLAYBOOK-ASPNET` → `./playbooks/aspnet-core-service.md`
    - `REF:ASPNET-RULES` → `./engineering/aspnet-core-rules.md`

ref_codes:
  - {code: "REF:PLAYBOOK-ASPNET", path: "./playbooks/aspnet-core-service.md", desc: "ASP.NET Core service playbook"}
  - {code: "REF:ASPNET-RULES",    path: "./engineering/aspnet-core-rules.md", desc: "ASP.NET Core engineering rules"}

routing_entries:
  - "ASP.NET Core endpoint / controller task → [ASP.NET Core Service Playbook](./playbooks/aspnet-core-service.md)"

rules:
  - {file: rules/backend.md, globs: ["src/backend/**/*.cs"]}

makefile_targets:
  - {name: lint-backend, cmd: "cd src/backend && dotnet format Backend.sln --verify-no-changes"}
  - {name: test-backend, cmd: "cd src/backend && dotnet test Backend.sln"}

verify:
  - {glob: "src/backend/**/*.cs", suites: "lint-backend + test-backend", cmd: "cd src/backend && dotnet format Backend.sln --verify-no-changes && dotnet test Backend.sln"}

dimensions:
  - {name: "ASP.NET Core endpoint",   read_files: ["docs/playbooks/aspnet-core-service.md", "docs/engineering/aspnet-core-rules.md"]}
  - {name: "Service / business logic", read_files: ["docs/engineering/aspnet-core-rules.md"]}
  - {name: "Middleware / DI wiring",  read_files: ["docs/engineering/aspnet-core-rules.md"]}
  - {name: "DTO validation",          read_files: ["docs/engineering/aspnet-core-rules.md", "docs/api-contracts/error-format.md"]}
  - {name: "Auth / authorization",    read_files: ["docs/engineering/aspnet-core-rules.md"]}

skill_enforcement:
  - {globs: ["src/backend/**/*.cs"], primary: aspnet-core, secondary: [clean-code, backend-fundamentals, api-design, auth-patterns, security-web, testing-strategy, observability]}
  - {globs: ["src/backend/**/*Service.cs", "src/backend/**/Repositories/**/*.cs", "src/backend/**/Data/**/*.cs"], primary: aspnet-core, secondary: [clean-code, db-design, backend-fundamentals]}
  - {globs: ["src/backend/**/*Authorization*.cs", "src/backend/**/Auth*.cs"], primary: aspnet-core, secondary: [auth-patterns, security-web, clean-code]}
