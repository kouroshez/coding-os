version: 1
id: java-plain
language: java
label: "Java (plain — library / console, Maven, no framework)"
category: backend
primary_skill: null
skills: []

structure:
  root: src/backend
  tree: |
    src/backend/
    ├── pom.xml                                  # Maven build manifest
    └── src/main/java/com/example/app/
        └── Main.java                            # entry point
  notes: "plain Maven module; framework stacks (spring-boot) replace this layout with a web application"

# Plain-language stack (template-authoring.md § Language layer): picked when the
# user chooses "java" without a framework. Ships a runnable Maven skeleton and
# the verify wiring; framework stacks (spring-boot) extend the language with
# their own conventions.

substitutions:
  DOMAIN_ROUTES: "Java module / CLI task → AGENTS.md critical rules"
  SKILL_ROUTES: "Java → `clean-code` (generic) + `thinking_os` (kernel)"
  ENGINEERING_RULE_ROUTING: "Java → AGENTS.md critical rules + `docs/governance/`"
  TOOL_ROUTING_IMPL: "`lint-java`, `test-java`"
  VERIFY_BACKEND_GLOB: "`src/backend/`"
  VERIFY_BACKEND_SUITES: "lint-java + test-java"
  VERIFY_BACKEND: "`cd src/backend && ./mvnw -q verify`"
  QUICK_ROUTING: |-
    - Java module / package task → see AGENTS.md critical rules
  STACK_REF_CODES: ""

ref_codes: []

routing_entries:
  - "Java module / CLI task → see AGENTS.md critical rules"

rules: []

makefile_targets:
  - {name: lint-java, cmd: "cd src/backend && ./mvnw -q -DskipTests spotless:check"}
  - {name: test-java, cmd: "cd src/backend && ./mvnw -q test"}

verify:
  - {glob: "src/backend/**/*.java", suites: "lint-java + test-java", cmd: "cd src/backend && ./mvnw -q verify"}

dimensions: []

skill_enforcement: []
