version: 1
id: svelte-sveltekit
language: typescript
label: "Svelte 5 + SvelteKit + TypeScript"
category: frontend

structure:
  root: src/frontend
  tree: |
    src/frontend/
    ├── svelte.config.js
    ├── vite.config.ts
    ├── package.json
    └── src/
        ├── app.html             # document shell only
        ├── hooks.server.ts      # the ONLY central error/response shaper (handleError)
        ├── lib/                 # $lib alias — components, stores, helpers
        │   ├── components/      # reusable .svelte UI, PascalCase
        │   └── stores/          # writable/derived state, one store per file
        └── routes/              # file-based routing
            ├── +layout.svelte   # root shell, nav, error boundary
            ├── +page.svelte     # a page component (presentational)
            ├── +page.ts         # universal load (runs client + server)
            └── +page.server.ts  # server-only load (secrets, db)
  notes: "file-based routing under routes/; load functions own data, components stay presentational; hooks.server.ts handleError is the only error-response shaper; secrets live only in +page.server.ts / +server.ts / hooks.server.ts"
primary_skill: svelte
skills: [svelte]

substitutions:
  DOMAIN_ROUTES: "Frontend→`docs/playbooks/svelte-sveltekit-app.md`"
  SKILL_ROUTES: "Frontend→`svelte`"
  ENGINEERING_RULE_ROUTING: "Frontend→`docs/engineering/svelte-sveltekit-rules.md`, a11y→`a11y` skill"
  TOOL_ROUTING_IMPL: "`lint-frontend`, `test-frontend`, `build-frontend`"
  VERIFY_FRONTEND_GLOB: "`src/frontend/`"
  VERIFY_FRONTEND_SUITES: "lint-frontend + test-frontend"
  VERIFY_FRONTEND: "`cd src/frontend && npm run lint && npm test`"
  QUICK_ROUTING: |-
    - SvelteKit route / +page task → [SvelteKit App Playbook](./playbooks/svelte-sveltekit-app.md)
    - Component / store / load work → [SvelteKit App Playbook](./playbooks/svelte-sveltekit-app.md)
  STACK_REF_CODES: |-
    - `REF:PLAYBOOK-SVELTEKIT` → `./playbooks/svelte-sveltekit-app.md`
    - `REF:SVELTEKIT-RULES` → `./engineering/svelte-sveltekit-rules.md`

ref_codes:
  - {code: "REF:PLAYBOOK-SVELTEKIT", path: "./playbooks/svelte-sveltekit-app.md",      desc: "SvelteKit app playbook"}
  - {code: "REF:SVELTEKIT-RULES",    path: "./engineering/svelte-sveltekit-rules.md",  desc: "SvelteKit engineering rules"}

routing_entries:
  - "SvelteKit route / +page task → [SvelteKit App Playbook](./playbooks/svelte-sveltekit-app.md)"

rules:
  - {file: rules/frontend.md, globs: ["src/frontend/**/*.{svelte,ts}"]}

makefile_targets:
  - {name: lint-frontend,  cmd: "cd src/frontend && npm run lint"}
  - {name: test-frontend,  cmd: "cd src/frontend && npm test"}
  - {name: build-frontend, cmd: "cd src/frontend && npm run build"}

verify:
  - {glob: "src/frontend/**/*.{svelte,ts}", suites: "lint-frontend + test-frontend", cmd: "cd src/frontend && npm run lint && npm test"}

dimensions:
  - {name: "Svelte component",  read_files: ["docs/playbooks/svelte-sveltekit-app.md", "docs/engineering/svelte-sveltekit-rules.md"]}
  - {name: "Route / +page",     read_files: ["docs/playbooks/svelte-sveltekit-app.md", "docs/engineering/svelte-sveltekit-rules.md"]}
  - {name: "Store / state",     read_files: ["docs/engineering/svelte-sveltekit-rules.md"]}
  - {name: "Accessibility",     read_files: ["docs/engineering/svelte-sveltekit-rules.md"]}

skill_enforcement:
  - {globs: ["src/frontend/**/*.{svelte,ts}"], primary: svelte, secondary: [clean-code, frontend-fundamentals, frontend-design, a11y, performance, testing-strategy]}
  - {globs: ["src/frontend/**/lib/stores/**/*.ts", "src/frontend/**/stores/**/*.ts"], primary: svelte, secondary: [state-management, clean-code, frontend-fundamentals]}
