version: 1
id: rust-plain
language: rust
label: "Rust (plain — std + Cargo, no web framework)"
category: backend
primary_skill: null
skills: []

structure:
  root: src/backend
  tree: |
    src/backend/
    ├── Cargo.toml
    └── src/
        └── main.rs        # grow into lib.rs + modules as the crate grows
  notes: "plain Cargo binary; split into lib.rs + a module tree (domain/ports/adapters) when it becomes a service"

# Plain-language stack (template-authoring.md § Language layer): picked when
# the user chooses "rust" without a framework. Ships a runnable crate skeleton
# and the verify wiring; framework stacks (rust-axum) extend the language with
# their own conventions.

substitutions:
  DOMAIN_ROUTES: "Rust crate / CLI task → AGENTS.md critical rules"
  SKILL_ROUTES: "Rust → `clean-code` (generic) + `thinking_os` (kernel)"
  ENGINEERING_RULE_ROUTING: "Rust → AGENTS.md critical rules + `docs/governance/`"
  TOOL_ROUTING_IMPL: "`lint-rust`, `test-rust`"
  VERIFY_BACKEND_GLOB: "`src/backend/`"
  VERIFY_BACKEND_SUITES: "lint-rust + test-rust"
  VERIFY_BACKEND: "`cd src/backend && cargo clippy -- -D warnings && cargo test`"
  QUICK_ROUTING: |-
    - Rust crate / module task → see AGENTS.md critical rules
  STACK_REF_CODES: ""

ref_codes: []

routing_entries:
  - "Rust crate / CLI task → see AGENTS.md critical rules"

rules: []

makefile_targets:
  - {name: lint-rust, cmd: "cd src/backend && cargo clippy -- -D warnings"}
  - {name: test-rust, cmd: "cd src/backend && cargo test"}

verify:
  - {glob: "src/backend/**/*.rs", suites: "lint-rust + test-rust", cmd: "cd src/backend && cargo clippy -- -D warnings && cargo test"}

dimensions: []

skill_enforcement: []
