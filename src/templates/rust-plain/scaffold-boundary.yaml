# Scaffold boundary for the rust-plain stack (std + Cargo only).
# Schema: docs/governance/scaffold-boundary-contract.md

version: 1
stack: rust-plain

roots:
  - src/backend/

file_patterns:
  - "src/backend/**/*.rs"
  - "src/backend/**/Cargo.toml"

imports_from:
  - src/shared/
  - src/shared/contracts/

forbids_writing_in:
  - src/frontend/
  - src/mobile/

notes:
  - "Plain Cargo crate — Cargo.toml lives in src/backend/. Framework stacks (rust-axum) replace this layout."
