version: 1
id: django
language: python
label: "Django + DRF + PostgreSQL"
category: backend
primary_skill: python-django
skills: [python-django]

# These substitution keys are joined across stacks by the aggregator
# via _derive_substitutions (joined on " | "). VERIFY_BACKEND_* override
# the "(none)" defaults from base.yaml.
substitutions:
  DOMAIN_ROUTES: "Backend→`docs/playbooks/backend-api.md`"
  SKILL_ROUTES: "Backend→`python-django`"
  ENGINEERING_RULE_ROUTING: "Backend→`docs/engineering/backend-rules.md`, Naming→`docs/engineering/naming-conventions.md`, Logging→`docs/engineering/logging-standards.md`"
  TOOL_ROUTING_IMPL: "`lint-backend`, `test-backend`, `migrate`"
  VERIFY_BACKEND_GLOB: "`src/backend/`"
  VERIFY_BACKEND_SUITES: "lint-backend + test-backend"
  VERIFY_BACKEND: "`make lint-backend && make test-backend`"
  QUICK_ROUTING: |-
    - Backend / API task → [Backend API Playbook](./playbooks/backend-api.md)
    - Security-sensitive task → [Security Review Playbook](./playbooks/security-review.md)
    - Research / package / standards check → [Research Playbook](./playbooks/research-validation.md)
  STACK_REF_CODES: |-
    - `REF:PLAYBOOK-BACKEND` → `./playbooks/backend-api.md`
    - `REF:BACKEND-RULES` → `./engineering/backend-rules.md`
    - `REF:NAMING` → `./engineering/naming-conventions.md`
    - `REF:LOGGING` → `./engineering/logging-standards.md`
    - `REF:GLOSSARY` → `./engineering/glossary.md`
    - `REF:PLAYBOOK-SECURITY` → `./playbooks/security-review.md`
    - `REF:PLAYBOOK-RESEARCH` → `./playbooks/research-validation.md`

ref_codes:
  - {code: "REF:PLAYBOOK-BACKEND",  path: "./playbooks/backend-api.md",         desc: "Backend API playbook"}
  - {code: "REF:BACKEND-RULES",     path: "./engineering/backend-rules.md",     desc: "Backend engineering rules"}
  - {code: "REF:NAMING",            path: "./engineering/naming-conventions.md", desc: "Naming conventions"}
  - {code: "REF:LOGGING",           path: "./engineering/logging-standards.md", desc: "Logging standards"}
  - {code: "REF:GLOSSARY",          path: "./engineering/glossary.md",          desc: "Glossary"}
  - {code: "REF:PLAYBOOK-SECURITY", path: "./playbooks/security-review.md",     desc: "Security review playbook"}
  - {code: "REF:PLAYBOOK-RESEARCH", path: "./playbooks/research-validation.md", desc: "Research validation playbook"}

routing_entries:
  - "Backend / API task → [Backend API Playbook](./playbooks/backend-api.md)"
  - "Security-sensitive task → [Security Review Playbook](./playbooks/security-review.md)"
  - "Research / package / standards check → [Research Playbook](./playbooks/research-validation.md)"

rules:
  - {file: rules/backend.md, globs: ["src/backend/**/*.py"]}

dimensions:
  - {name: "Django model / schema", read_files: ["docs/engineering/backend-rules.md", "docs/playbooks/backend-api.md"]}
  - {name: "DRF endpoint",          read_files: ["docs/playbooks/backend-api.md", "docs/api-contracts/error-format.md"]}
  - {name: "Auth / permissions",    read_files: ["docs/playbooks/security-review.md"]}

skill_enforcement:
  - {globs: ["src/backend/**/*.py"], primary: python-django, secondary: [clean-code, backend-fundamentals, api-design, auth-patterns, security-web, testing-strategy, observability]}
  - {globs: ["src/backend/**/models.py", "src/backend/**/migrations/*.py"], primary: python-django, secondary: [clean-code, db-design, backend-fundamentals]}
  - {globs: ["src/backend/**/auth*.py", "src/backend/**/permissions.py"], primary: python-django, secondary: [auth-patterns, security-web, clean-code]}

makefile_targets:
  - {name: lint-backend, cmd: "cd src/backend && ruff check ."}
  - {name: test-backend, cmd: "cd src/backend && pytest -q"}
