# Scaffold boundary for the fastapi stack.
# Schema: docs/governance/scaffold-boundary-contract.md

version: 1
stack: fastapi

roots:
  - src/backend/

file_patterns:
  - "src/backend/**/*.py"

imports_from:
  - src/shared/
  - src/shared/types/
  - src/shared/contracts/

forbids_writing_in:
  - src/frontend/
  - src/mobile/
  - src/ai-service/

notes:
  - "Routers thin; services own logic; repositories own DB access."
  - "Alembic revisions append-only; never edit a merged revision."
