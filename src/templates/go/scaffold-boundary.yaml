# Scaffold boundary for the go stack (stdlib + chi).
# Schema: docs/governance/scaffold-boundary-contract.md

version: 1
stack: go

roots:
  - src/backend/

file_patterns:
  - "src/backend/**/*.go"

imports_from:
  - src/shared/
  - src/shared/types/
  - src/shared/contracts/

forbids_writing_in:
  - src/frontend/
  - src/mobile/
  - src/ai-service/

notes:
  - "Go module root is src/backend/ (go.mod lives there). Hexagonal: cmd → internal handler → service → repo."
  - "Race detector mandatory on CI (`go test -race`)."
