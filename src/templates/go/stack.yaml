version: 1
id: go
language: go
label: "Go (stdlib + chi)"
category: backend

structure:
  root: src/backend
  tree: |
    src/backend/
    ├── cmd/<binary>/
    └── internal/{handler,service,repo}
  notes: "internal/-centric per Go community convention; go.mod lives in src/backend"
primary_skill: go-patterns
skills: [go-patterns]

substitutions:
  DOMAIN_ROUTES: "Backend→`docs/playbooks/go-service.md`"
  SKILL_ROUTES: "Backend→`go-patterns`"
  ENGINEERING_RULE_ROUTING: "Backend→`docs/engineering/go-rules.md`"
  TOOL_ROUTING_IMPL: "`lint-go`, `test-go`"
  VERIFY_BACKEND_GLOB: "`src/backend/`"
  VERIFY_BACKEND_SUITES: "lint-go + test-go"
  VERIFY_BACKEND: "`cd src/backend && go vet ./... && go test ./...`"
  QUICK_ROUTING: |-
    - Backend / API task → [Go Service Playbook](./playbooks/go-service.md)
  STACK_REF_CODES: |-
    - `REF:PLAYBOOK-GO` → `./playbooks/go-service.md`
    - `REF:GO-RULES` → `./engineering/go-rules.md`

ref_codes:
  - {code: "REF:PLAYBOOK-GO", path: "./playbooks/go-service.md", desc: "Go service playbook"}
  - {code: "REF:GO-RULES",    path: "./engineering/go-rules.md",  desc: "Go engineering rules"}

routing_entries:
  - "Backend / API task → [Go Service Playbook](./docs/playbooks/go-service.md)"

rules:
  - {file: rules/backend.md, globs: ["src/backend/**/*.go"]}

makefile_targets:
  - {name: lint-go, cmd: "cd src/backend && go vet ./..."}
  - {name: test-go, cmd: "cd src/backend && go test ./..."}

dimensions:
  - {name: "HTTP handler", read_files: ["docs/playbooks/go-service.md"]}
  - {name: "Concurrency", read_files: ["docs/engineering/go-rules.md"]}

skill_enforcement:
  - {globs: ["src/backend/**/*.go"], primary: go-patterns, secondary: [clean-code, backend-fundamentals, api-design, hexagonal-architecture, testing-strategy, observability]}
  - {globs: ["src/backend/**/db/**/*.go", "src/backend/**/repository/**/*.go"], primary: go-patterns, secondary: [clean-code, db-design, backend-fundamentals]}
