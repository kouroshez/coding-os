# Scaffold boundary for the node-express stack.
# Schema: docs/governance/scaffold-boundary-contract.md

version: 1
stack: node-express

roots:
  - src/backend/

file_patterns:
  - "src/backend/**/*.ts"
  - "src/backend/**/*.json"

imports_from:
  - src/shared/
  - src/shared/types/
  - src/shared/contracts/

forbids_writing_in:
  - src/frontend/
  - src/mobile/

notes:
  - "Routes thin; services own logic; repositories own data access."
  - "Central error middleware is the only error-response shaper."
