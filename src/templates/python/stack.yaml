version: 1
id: python
language: python
label: "Python library / CLI / MCP server"
category: library

structure:
  root: src
  tree: |
    src/<package>/       # src-layout package
    tests/               # mirrors the package tree
  notes: "src-layout; packaging SSOT is pyproject.toml (docs/engineering/python-rules.md)"
primary_skill: null
skills: []

# Generic Python stack — for libraries, CLI tools, MCP servers, and the
# coding-os meta-repo itself. No stack-specific skill files; the always-on
# core skills (clean-code, thinking_os, codebase-explorer, worktree-orchestration)
# from base.yaml cover Python authoring.
#
# When this stack is selected for the coding-os meta-repo, the canonical
# rules live in CLAUDE.md (rules 0–23). For consumer projects using this
# stack, see docs/governance/critical-rules.md as the entry point.

substitutions:
  DOMAIN_ROUTES: "Python module / CLI / MCP tool → `docs/playbooks/python-library.md`"
  SKILL_ROUTES: "Python → `clean-code` + `testing-strategy` + `shell-scripting` + `sql-authoring` (core skills)"
  ENGINEERING_RULE_ROUTING: "Python → `docs/engineering/python-rules.md` + `docs/governance/`"
  TOOL_ROUTING_IMPL: "`pytest` (lint/format opt-in: ruff/mypy not enforced by default)"
  QUICK_ROUTING: |-
    - Python module / package task → [Python Library Playbook](./playbooks/python-library.md)
    - MCP tool / CLI command task → [Python Library Playbook](./playbooks/python-library.md)
    - Test / fixture task → `tests/` + `pytest`
  STACK_REF_CODES: |-
    - `REF:PLAYBOOK-PY` → `./playbooks/python-library.md`
    - `REF:PY-RULES` → `./engineering/python-rules.md`

ref_codes:
  - {code: "REF:PLAYBOOK-PY", path: "./playbooks/python-library.md", desc: "Python library/CLI playbook"}
  - {code: "REF:PY-RULES",    path: "./engineering/python-rules.md", desc: "Python engineering rules"}

routing_entries:
  - "Python module / CLI / MCP tool task → [Python Library Playbook](./docs/playbooks/python-library.md)"

# No stack-specific rules. CLAUDE.md (or consumer AGENTS.md) carries them.
rules: []

dimensions:
  - {name: "Python module / API", read_files: ["docs/playbooks/python-library.md", "docs/engineering/python-rules.md"]}
  - {name: "CLI command", read_files: ["docs/playbooks/python-library.md"]}

# No skill_enforcement globs. Generic clean-code applies to all Python via
# the global skill list in base.yaml. Stack-specific globs would either
# duplicate that or conflict with consumer project layouts.
skill_enforcement: []

# No stack-specific Makefile targets. The meta-repo's Makefile already
# defines `make verify`, `make verify-hooks`, etc. Consumer Python libraries
# can add targets if they need them.
makefile_targets: []
