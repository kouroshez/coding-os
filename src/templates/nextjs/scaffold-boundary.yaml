# Scaffold boundary for the nextjs stack.
# Schema: docs/governance/scaffold-boundary-contract.md
# SSOT for what `src/frontend/` may write, read, or import.

version: 1
stack: nextjs

roots:
  - src/frontend/

file_patterns:
  - "src/frontend/**/*.ts"
  - "src/frontend/**/*.tsx"
  - "src/frontend/**/*.js"
  - "src/frontend/**/*.jsx"
  - "src/frontend/**/*.css"

imports_from:
  - src/shared/
  - src/shared/types/
  - src/shared/contracts/

forbids_writing_in:
  - src/backend/
  - src/mobile/
  - src/ai-service/

notes:
  - "Server Component first; client-only files end with `.client.tsx`."
  - "Cross-stack types live in src/shared/types — never import directly from another stack root."
