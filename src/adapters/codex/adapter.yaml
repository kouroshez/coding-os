version: 1
id: codex
label: "OpenAI Codex CLI"

# Hub chat model picker — adapter→models SSOT (served by /api/config/adapters).
# runtime: roadmap ⇒ declared but not yet runnable inside Hub chat (Claude SDK
# only today).
#
# Only IDs actually executed through this adapter's own dispatch flags are listed
# (P7 no-guessing): the entry below was verified with `codex exec
# --ignore-user-config --disable hooks --config mcp_servers={} --ephemeral
# --sandbox read-only --model <id>`. `gpt-5-codex`, `gpt-5` and `gpt-5.6` were
# probed the same way and every one returns 400 on a ChatGPT-account login, so a
# single entry is the honest catalog rather than an artificially narrow one.
#
# An empty catalog was NOT restrictive — `_accepts_model` reads
# `not declared or model in declared`, so it forwarded any string. What it broke
# was defaulting: `_default_model()` returned None and dispatcher.py skips
# `resolve_model_alias` when the id set is empty, so a role tier like `sonnet`
# reached the CLI verbatim and died at the provider. Declaring the catalog is
# what gives aliases something to resolve against.
#
# `efforts` stays undeclared because the CLI neither enumerates nor rejects
# `model_reasoning_effort`, so there is no producer to read the enum from. Note
# this is NOT a soft skip: `_accepts_effort` returns False at the
# `effort_selection` capability gate below, so an effort pinned to a codex role
# is a hard dispatch error. Keep `effort: ""` on codex roles until the capability
# is declared.
runtime: roadmap
runtime_entrypoints:
  dispatch: sdk_dispatcher.py
  transcript: chat_provider.py
  account: account_probe.py
  capabilities: [dispatch, transcript, model_selection, structured_output, account]
models:
  - id: gpt-5.6-sol
    label: "GPT-5.6 Sol"
    bucket: gpt-5x
    default: true
    # Standard-tier list price, read from the source below on the date below.
    # It exists because the Codex CLI reports tokens and no dollar figure, so
    # without a table every codex dispatch lands as a priceless row and the
    # per-adapter cost rollup silently reads as "codex is free". Claude needs no
    # equivalent: its SDK returns total_cost_usd itself.
    #
    # Batch / Flex / Fast-mode tiers are NOT declared. Dispatch goes through
    # `codex exec`, which is standard tier; declaring rates nothing here can
    # select would invite a caller to pick one and be quietly wrong.
    #
    # Cache writes are 1.25x the uncached input rate by OpenAI's own statement
    # ("OpenAI bills cache writes at 1.25x the uncached input rate"), which is
    # exactly 5.00 -> 6.25 and 10.00 -> 12.50 below: the two numbers were read
    # independently and agree, which is the only reason to trust either.
    pricing:
      unit: usd_per_mtok
      source: https://platform.openai.com/docs/pricing
      retrieved: "2026-08-21"
      # Above this many INPUT tokens the long tier applies to the whole call:
      # "Requests that exceed the standard 272K context window count against
      # usage limits at 2x the normal rate" (openai.com/index/introducing-gpt-5-4).
      # Measured on input alone, not input+output.
      long_context_input_tokens: 272000
      rates:
        short: { input: 5.00, cached_input: 0.50, cache_write: 6.25, output: 30.00 }
        long: { input: 10.00, cached_input: 1.00, cache_write: 12.50, output: 45.00 }

presence:
  signal: hook_timestamps
  hub_glyph: "Cx"
  hub_color: "#0891b2"
  presence_events:
    - SessionStart
    - UserPromptSubmit
    - PreToolUse
    - PostToolUse
    - SubagentStart
    - SubagentStop
    - Stop
    - SessionEnd
settings_file: ".codex/hooks.json"
hooks_dir: ".codex/hooks"
rules_dir: ".codex/rules"
skills_dir: ".codex/skills"
commands_dir: ".codex/commands"
# Codex reads AGENTS.md at the project root natively, so it needs no linked
# entrypoint of its own.
entrypoint_file: null
sourced_hooks: [cos-env.sh]
supports_rules: true
supports_settings_json: true
install_script: install.sh

# Dispatch wall-clock budget. Role/agent timeouts are calibrated on Claude
# (44-53s measured); codex is materially slower — a successful review measured
# 123s, and the 120s agent default timed it out at the finish line. Declared
# here rather than branched on in code so the kernel stays adapter-agnostic.
dispatch_timeout_s: 420

cli_binary: codex
sdk_package: openai-codex
sdk_optional_extra: codex-sdk
auth_env_vars: [CODEX_API_KEY, OPENAI_API_KEY]
chat_provider: chat_provider.py

# Env vars the Codex CLI runtime exports.  Same purpose as the field on
# the Claude adapter — keeps agent detection data-driven (rule #11).
runtime_env_markers:
  - CODEX_SESSION_ID
  - CODEX_AGENT_DIR
  - CODEX_HOME

# Per-panel session identity — see adapters/claude/adapter.yaml for the
# contract. Codex CLI exports CODEX_SESSION_ID to hook subprocesses; the
# stdin payload also carries session_id per the OpenAI Codex hook spec.
runtime_session_marker:
  stdin_field: session_id
  env_vars:
    - CODEX_SESSION_ID

# Helper script invoked by `cos setup-mcp` / `cli/main.py` to write Codex
# MCP config safely (TOML-aware).
mcp_helper: ensure_codex_mcp.py

# MCP launch metadata consumed by cli/doctor.py::_load_coding_os_mcp_launch
# (C15 check). Data-driven so tests/test_no_hardcoded_stacks.py stays green.
mcp_launch:
  loader: codex_toml       # maps to cli.doctor._load_codex
  config_paths:
    - scope: project
      path: .codex/config.toml
    - scope: home
      path: .codex/config.toml
default_settings: {}

hook_registry_output: hooks.template.json

hook_capabilities:
  PreToolUse:
    matchers: [Bash, Edit, Read, "mcp__coding-os__cos_task_move", "mcp__coding-os__cos_task_create", "mcp__coding-os__cos_work_log_append"]
  PostToolUse:
    matchers: [Bash, Edit, "mcp__coding-os__cos_backtrack_log", "mcp__coding-os__cos_task_move"]
  Stop:
    matchers: [""]
  SubagentStart:
    matchers: [""]
  SubagentStop:
    matchers: [""]
  SessionStart:
    matchers: [startup, "compact|resume", clear]
  PreCompact:
    matchers: [""]
  PostCompact:
    matchers: [""]
  PermissionRequest:
    matchers: [""]
  UserPromptSubmit:
    matchers: [""]
  SessionEnd:
    matchers: [""]

# Codex launches multiple matching command hooks concurrently for the same
# event. Coalesce selected groups into one dispatcher so sequencing and UI
# visibility stay deterministic.
hook_dispatchers:
  - event: SessionEnd
    matcher: ""
    script: codex-sessionend-dispatch.sh
    timeout: 3
    delegates:
      - agent-presence.sh
  - event: PreToolUse
    matcher: Bash
    script: codex-pretool-dispatch.sh
    delegates:
      - block-secrets.sh
      - block-dangerous-commands.sh
      - branch-guard.sh
      - enforce-commit-message.sh
      - block-uv-heredoc.sh
      - enforce-verify.sh
      - enforce-task-readiness.sh
      - test-governor.sh
      - search-enforce-inventory.sh
      - nudge-task-discovery.sh
      - warn-diff-size.sh
      - agent-presence.sh
  - event: PreToolUse
    matcher: Edit
    script: codex-preedit-dispatch.sh
    delegates:
      - block-secrets.sh
      - block-bad-patterns.sh
      - block-protected-files.sh
      - block-shared-tree-edit.sh
      - enforce-task-transition.sh
      - block-migration-conflict.sh
      - block-hardcoded-literals.sh
      - validate-task-frontmatter.sh
      - enforce-wip-limit.sh
      - enforce-template.sh
      - thinking_os-gate.sh
      - enforce-scaffold-boundary.sh
      - enforce-task-start.sh
      - enforce-doc-anchor.sh
      - enforce-memory-check.sh
      - enforce-skill.sh
      - enforce-zoom.sh
      - enforce-graph-context.sh
      - warn-destructive-edit.sh
      - enforce-rename-plan.sh
      - enforce-task-body.sh
      - enforce-anti-ambiguity.sh
      - jit-recall.sh
  - event: SessionStart
    matcher: startup
    script: codex-sessionstart-dispatch.sh
    status_message: "🚀 Loading session context + MCP health..."
    delegates:
      - session-context.sh
      - warn-mcp-down.sh
      - check-mcp-extras.sh
      - rules-primer.sh
      - session-skill-primer.sh
      - remind-daily.sh
      - warn-graph-empty.sh
      - auto-brain-decay.sh
      - agent-presence.sh
      - pr-reap.sh
  - event: SessionStart
    matcher: "compact|resume"
    script: codex-sessionstart-dispatch.sh
    status_message: "🔄 Recovering workflow context + MCP health..."
    delegates:
      - session-context.sh
      - warn-mcp-down.sh
      - check-mcp-extras.sh
      - rules-primer.sh
      - session-skill-primer.sh
      - remind-daily.sh
      - warn-graph-empty.sh
      - auto-brain-decay.sh
      - agent-presence.sh
      - pr-reap.sh
  - event: SessionStart
    matcher: clear
    script: codex-sessionstart-dispatch.sh
    status_message: "Loading clean session context..."
    delegates:
      - session-context.sh
      - warn-mcp-down.sh
      - check-mcp-extras.sh
      - rules-primer.sh
      - session-skill-primer.sh
      - remind-daily.sh
      - warn-graph-empty.sh
      - auto-brain-decay.sh
      - agent-presence.sh
      - pr-reap.sh
  - event: Stop
    matcher: ""
    script: codex-stop-dispatch.sh
    status_message: "📝 Finalizing session recap + memory enrichment..."
    timeout: 5000
    delegates:
      - enforce-humanizer-audit.sh
      - session-end.sh
      - warn-abandoned-task.sh
      - nudge-learn-narrative.sh
      - check-capture-worked.sh
      - auto-trace-rotate.sh
      - snapshot-transcript.sh
      - drain-embedding-outbox.sh
      - agent-presence.sh
  - event: PostToolUse
    matcher: Bash
    script: codex-posttool-dispatch.sh
    delegates:
      - remind-learn-validate.sh
      - record-verify-auto.sh
      - auto-graph-reconcile-shell.sh
      - search-verify-remaining.sh
      - advance-role.sh
      - sync-task-current.sh
      - agent-presence.sh
  - event: PostToolUse
    matcher: Edit
    script: codex-postedit-dispatch.sh
    delegates:
      - lint-task.sh
      - enforce-doc-sync.sh
      - verify-rename-callers.sh
      - advance-role.sh
      - track-discovery.sh
      - auto-reindex-docs.sh
      - auto-regen-doc-index.sh
      - auto-task-sync.sh
      - capture-observation.sh
      - capture-work-log.sh
      - agent-presence.sh
      - nudge-reuse-first.sh
      - check-doc-size.sh
      - regen-reminder.sh
      - test-first-reminder.sh
      - check-agents-md-size.sh
      - check-agents-md-refs.sh
      - remind-dogfood.sh
  - event: UserPromptSubmit
    matcher: ""
    script: codex-userpromptsubmit-dispatch.sh
    # Order mirrors what hook_renderer.py emits for a capability-complete
    # adapter: category precedence (cognition 20 before observability 40), ties
    # by registry index. It is not cosmetic — session-context.sh BUILDS the
    # transparency banner from .task-mode / .roles / .supervise-route, so a
    # dispatcher that ran it first showed every cognitive field one turn stale
    # on Codex while Claude showed it live.
    # Contract: docs/engineering/adapter-parity.md § Execution order within a group.
    delegates:
      - nudge-thinking-os.sh
      - auto-compose-roles.sh
      - classify-task-mode.sh
      - nudge-graph-os.sh
      - nudge-humanizer.sh
      - nudge-model-routing.sh
      - resolve-supervise-route.sh
      - nudge-git-mode.sh
      - nudge-task-discovery.sh
      - nudge-docs-first.sh
      - session-context.sh
      - nudge-reentry.sh
      - agent-presence.sh
