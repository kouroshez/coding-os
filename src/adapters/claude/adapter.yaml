version: 1
id: claude
label: "Anthropic Claude Code"

# Hub board pills + presence contract (see docs/engineering/adapter-parity.md).
presence:
  signal: hook_timestamps
  hub_glyph: "Cl"
  hub_color: "#d97706"
  # Events Claude Code's hook spec actually fires; SessionEnd is not in the
  # spec — Stop is the canonical session-end signal — so it is omitted.
  # 2026-05-04: SDK 0.1.73 also fires SubagentStart/Stop and
  # PostToolUseFailure — declared so the agent-presence hook stays
  # accurate while sub-agents work and when tools error out.
  presence_events:
    - SessionStart
    - UserPromptSubmit
    - PreToolUse
    - PostToolUse
    - PostToolUseFailure
    - SubagentStart
    - SubagentStop
    - Stop
settings_file: ".claude/settings.json"
hooks_dir: ".claude/hooks"
rules_dir: ".claude/rules"
skills_dir: ".claude/skills"
commands_dir: ".claude/commands"
sourced_hooks: [cos-env.sh]
supports_rules: true
supports_settings_json: true
install_script: install.sh

# CLI binary discovery (consumed by cli/doctor.py — keeps that file free of
# hardcoded "claude" literals; Rule 11). cli_binary is the executable name to
# look up via shutil.which; sdk_package is the importable Python package whose
# version doctor reports.
cli_binary: claude
sdk_package: claude-agent-sdk

# Env vars the Claude Code runtime exports to hook subprocesses / the CLI
# shell.  Consumed by cli/board_commands.py::_detect_agent_runtime so the
# CLI can attribute agent_session correctly without hardcoded literals
# (see rule #11). CLAUDE_PROJECT_DIR is intentionally omitted — Cursor
# also sets it as a workspace alias, so it's not a reliable Claude signal.
runtime_env_markers:
  - CLAUDECODE
  - CLAUDE_CODE_SSE_PORT
  - CLAUDE_CODE_ENTRYPOINT
  - CLAUDE_AGENT_SDK_VERSION

# Per-panel session identity — declares how cos_panel_upgrade_from_payload
# (src/core/hooks/cos-env.sh) derives the panel id from this agent's hook
# stdin payload, and which env vars the agent runtime exports as fallback.
# Adding a new adapter (e.g. gemini) = add this block to its adapter.yaml;
# no code change in src/core/hooks/ or src/cli/ (Rule 11 data-driven).
#
# stdin_field: JSON key in the hook stdin payload carrying the panel id.
#   Claude Code spec: every hook event payload has `session_id` (UUID).
# env_vars: priority-ordered fallback when stdin is unavailable
#   (e.g. raw bash test, hook helpers that don't slurp stdin).
runtime_session_marker:
  stdin_field: session_id
  env_vars:
    - CLAUDE_SESSION_ID
    - ANTHROPIC_SESSION_ID

# MCP launch metadata consumed by cli/doctor.py::_load_coding_os_mcp_launch
# (C15 check). Data-driven so tests/test_no_hardcoded_stacks.py stays green.
mcp_launch:
  loader: claude_json      # maps to cli.doctor._load_claude_json
  config_paths:
    - scope: project
      path: .mcp.json

# Deep-merged with aggregated hooks by render_settings_json().
# Phase 1: empty — adapter's existing install.sh already writes settings.json.
default_settings: {}

# Output file the renderer writes to (relative to adapters/claude/).
hook_registry_output: settings.template.json

# Hook capabilities — which {event, matcher} pairs this agent can trigger.
# Used by cli/hook_renderer.py to filter core/hooks/registry.yaml entries
# when rendering settings.template.json. A hook whose event/matcher is
# not in this list is skipped for this adapter.
#
# Source: per-event matchers observed in the live Claude Code hook spec.
hook_capabilities:
  PreToolUse:
    matchers: [Bash, "Write|Edit", "Write|Edit|MultiEdit", Skill, Read]
  PostToolUse:
    matchers: [Bash, "Write|Edit", "Write|Edit|MultiEdit", Skill, "mcp__coding-os__cos_backtrack_log"]
  # PostToolUseFailure (SDK 0.1.73): fires when a tool errored. Empty
  # matcher = match all tools; presence/observation hooks keep the
  # board's activity signal accurate even on failures.
  PostToolUseFailure:
    matchers: [""]
  Stop:
    matchers: [""]
  # Subagent lifecycle (SDK 0.1.73 native; previously TS-only).
  SubagentStart:
    matchers: [""]
  SubagentStop:
    matchers: [""]
  SessionStart:
    matchers: [startup, "compact|resume"]
  # UserPromptSubmit powers the agent-presence hook's "user turn in
  # flight" signal so the live-agents panel knows the session is
  # actively working even between tool calls.
  UserPromptSubmit:
    matchers: [""]
