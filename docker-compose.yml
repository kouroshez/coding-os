# coding-os Hub — compose file.
#
#   docker compose up                  # build + run the Hub
#   open http://127.0.0.1:9188
#
# Architecture split:
#   - Hub (this container)  → web/visualization layer (graph · board ·
#     cognition · search). Stateless beyond the named volume below.
#   - Consumer projects     → live on the HOST filesystem (each has
#     its own .coding-os/, MCP server, skills, adapters). The Hub
#     READS their state via the bind mount declared below — it does
#     NOT manage their lifecycle.
#
# Auto-discovery contract:
#   SCAN_ROOT is bind-mounted read-only inside the container at the SAME
#   path, so every absolute path in the registry stays valid inside the
#   container. It defaults to the directory you run compose from.
#
# Wider scan root — you are choosing to expose it, read-only, to the container:
#   SCAN_ROOT=$HOME docker compose up            # everything under home
#   SCAN_ROOT=$HOME/projects docker compose up   # just your projects
#   (`cos registry scan ~` needs the first form.)
#
# Reachability: the Hub is published to the host's loopback only. To expose it
# on the LAN, set HUB_PUBLISH=0.0.0.0 *and* COS_HUB_TOKEN=<secret> — the hub is
# otherwise unauthenticated (docs/engineering/hub-threat-model.md).
services:
  hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: coding-os-hub:latest
    ports:
      # Published to the HOST's loopback only. A bare "9188:9188" listens on
      # every host interface, which with an unauthenticated hub hands the whole
      # API and code graph to anyone on the LAN. Set HUB_PUBLISH=0.0.0.0 and a
      # COS_HUB_TOKEN together if you really want it reachable.
      - "${HUB_PUBLISH:-127.0.0.1}:9188:9188"
    environment:
      # 0.0.0.0 INSIDE the container is how Docker port-publishing works — the
      # container's own interfaces are not the exposure boundary, the `ports`
      # mapping above is. That is why the off-loopback bind guard is waived
      # here and nowhere else; if you widen HUB_PUBLISH, set COS_HUB_TOKEN too.
      COS_HUB_ALLOW_INSECURE_BIND: "1"
      COS_WEB_HOST: 0.0.0.0
      COS_WEB_PORT: "9188"
      # Tell the Hub where the host's registry lives. Defaults to the
      # XDG location relative to the host's $HOME (which is bind-mounted
      # same-path below). Override if you keep it elsewhere.
      COS_REGISTRY_PATH: ${COS_REGISTRY_PATH:-${HOME}/.config/coding-os/registry.json}
      # Default scan root surfaced by /api/hub/suggest-roots and used
      # by `cos registry scan` inside the container.
      COS_SCAN_ROOT: ${SCAN_ROOT:-/host}
    volumes:
      # Hub's own runtime state (SQLite, traces) — survives down/up.
      - cos-state:/app/.coding-os
      # Host filesystem mount — read-only, and scoped to the directory you ran
      # compose from. It defaulted to all of $HOME: read-only, but still every
      # ssh key, browser profile and password store readable by a container
      # process, to index one project. Opt in explicitly for a wider window:
      #   SCAN_ROOT=$HOME docker compose up
      # Mounted at /host AND at the same path as on the host (via the second
      # bind) so absolute paths in the registry resolve.
      - type: bind
        source: ${SCAN_ROOT:-${PWD}}
        target: /host
        read_only: true
      - type: bind
        source: ${SCAN_ROOT:-${PWD}}
        target: ${SCAN_ROOT:-${PWD}}
        read_only: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9188/api/health').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cos-state:
