version: 1
id: meta
label: "Coding OS Meta-Project (DNA)"
category: library
primary_skill: graph-explorer
# Stack-scoped skills declared by templates/meta/skills/. The auto-linker
# (core/scripts/link-stack-skills.sh) symlinks these into every adapter's
# skills dir when this stack is in .coding-os.yaml::templates. Universal
# skills (clean-code, search, codebase-explorer, etc) come from
# core/skills/ and are linked unconditionally — they aren't repeated here.
skills: [graph-explorer, meta-engineering, python-meta-server, react-vite-hub, claude-sdk-integration, thinking_os, clean-code, codebase-explorer, search]

# Substitutions injected into AGENTS.md / CLAUDE.md when the meta stack
# is installed. Library-category stacks may omit verify keys; meta keeps
# them aligned with the live verification matrix in AGENTS.md.
substitutions:
  STACK: "Meta (Python + Shell + Markdown)"
  DOMAIN_ROUTES: "Meta-project edit → `docs/architecture/meta-project.md` § Layer routing"
  SKILL_ROUTES: "core/**/*.py, cli/**/*.py, adapters/**/*.py → `graph-explorer` + `clean-code` + `thinking_os`"
  ENGINEERING_RULE_ROUTING: |-
    core/thinking_os/** → `docs/engineering/mcp-error-envelope.md`, `docs/engineering/graph_os-queries.md`
    core/graph_os/**     → `docs/engineering/graph_os-queries.md`, `docs/engineering/graph-hallucination-cures.md`
    core/hooks/**        → `docs/engineering/hook-authoring.md` (when present), `core/hooks/registry.yaml`
    cli/**               → `docs/engineering/cli-architecture.md` (when present)
    adapters/**          → `docs/adapters/<id>.md`
    templates/**         → `docs/architecture/meta-project.md` § Templates
  TOOL_ROUTING_IMPL: "`make verify`, `make verify-hooks`, `make test-mcp`, `make regen-rules`, `make regen-adapter-templates`, `make dogfood-full`"
  VERIFY_BACKEND_GLOB: "(meta — uses Verification Matrix in AGENTS.md)"
  VERIFY_BACKEND_SUITES: "matrix-targeted only (never full sweep mid-task)"
  VERIFY_BACKEND: "see AGENTS.md § Verification Matrix"
  QUICK_ROUTING: |-
    - Meta-project change (core/, cli/, adapters/, templates/) → `docs/architecture/meta-project.md`
    - Graph-aware structural query → `Skill graph-explorer` + relevant `cos_graph_*`
    - COMPLICATED+ task → `Skill thinking_os` + `cos_compose_chain`
  STACK_REF_CODES: |-
    - `REF:META-PROJECT`           → `./architecture/meta-project.md`
    - `REF:GRAPH-QUERIES`          → `./engineering/graph_os-queries.md`
    - `REF:GRAPH-HALLUCINATIONS`   → `./engineering/graph-hallucination-cures.md`
    - `REF:MCP-ENVELOPE`           → `./engineering/mcp-error-envelope.md`
    - `REF:HOOK-REGISTRY`          → `../core/hooks/registry.yaml`

ref_codes:
  - {code: "REF:META-PROJECT",         path: "./architecture/meta-project.md",         desc: "Meta-project layered architecture"}
  - {code: "REF:GRAPH-QUERIES",        path: "./engineering/graph_os-queries.md",      desc: "Graph query routing"}
  - {code: "REF:GRAPH-HALLUCINATIONS", path: "./engineering/graph-hallucination-cures.md", desc: "Graph hallucination cures"}
  - {code: "REF:MCP-ENVELOPE",         path: "./engineering/mcp-error-envelope.md",    desc: "MCP error envelope contract"}

routing_entries:
  - "Meta-project change (core/, cli/, adapters/, templates/) → [Meta-Project Architecture](./architecture/meta-project.md)"
  - "Structural code question (callers, blast radius, rename) → `Skill graph-explorer` + `cos_graph_*`"
  - "COMPLICATED+ task → `Skill thinking_os` + `cos_compose_chain`"

# Rule glob is the same shape django uses — fnmatch-style. The agent
# editor matches against repo-relative paths.
rules:
  - {file: rules/meta-engineering.md, globs: ["core/**/*.py", "cli/**/*.py", "adapters/**/*.py", "core/hooks/*.sh", "core/hooks/_helpers/*.py", "core/scripts/*.sh"]}
  - {file: rules/mcp-tool-author.md,  globs: ["core/thinking_os/tools/*.py", "core/graph_os/tools/*.py", "core/board_os/mcp_tools.py", "core/web/routes/*.py"]}
  - {file: rules/hook-author.md,      globs: ["core/hooks/*.sh", "core/hooks/_helpers/*.py", "core/hooks/registry.yaml"]}
  - {file: rules/graph-first.md,      globs: ["core/**/*.py", "cli/**/*.py", "adapters/**/*.py", "templates/**/stack.yaml", "core/hooks/registry.yaml"]}

# Dimensions feed core/rules/dimension-registry.md. They are the
# Classify-phase Read List for an agent editing meta-repo files.
dimensions:
  - {name: "MCP tool authoring (cos_*)",          read_files: ["docs/engineering/mcp-error-envelope.md", "docs/governance/mcp-tool-inventory.md"]}
  - {name: "Graph extractor / backend",           read_files: ["docs/engineering/graph_os-queries.md", "docs/engineering/graph-hallucination-cures.md"]}
  - {name: "Hook authoring (core/hooks/)",        read_files: ["core/hooks/registry.yaml", "docs/engineering/hook-architecture.md"]}
  - {name: "Adapter authoring (adapters/<id>/)",  read_files: ["docs/adapters/claude-sdk.md", "docs/engineering/adapter-parity.md"]}
  - {name: "Template / stack authoring (templates/<id>/)", read_files: ["docs/architecture/meta-project.md", "core/schemas/stack.schema.json"]}
  - {name: "CLI command authoring (cli/)",        read_files: ["docs/architecture/meta-project.md", "docs/engineering/cli-architecture.md"]}
  - {name: "Hub / web routes (core/web/)",        read_files: ["docs/engineering/hub-architecture.md"]}
  - {name: "Board / Scrumban (core/board_os/)",   read_files: ["docs/engineering/board_os.md", "docs/governance/task-lifecycle.md"]}
  - {name: "Cognition / formula composer",        read_files: ["docs/adapters/claude-sdk.md", "docs/governance/critical-rules.md"]}
  - {name: "Rule SSOT regen",                     read_files: ["docs/architecture/meta-project.md"]}

# Auto-load skills for meta-repo file globs. Each row picks the
# narrowest skill that knows the conventions of that surface — the
# secondary list adds cross-cutting skills (clean-code, thinking_os).
skill_enforcement:
  # MCP server / tools / cognition / dispatcher
  - {globs: ["core/thinking_os/**/*.py"], primary: python-meta-server, secondary: [graph-explorer, clean-code, thinking_os]}
  # Knowledge graph + extractors
  - {globs: ["core/graph_os/**/*.py"],    primary: python-meta-server, secondary: [graph-explorer, clean-code]}
  # Board engine
  - {globs: ["core/board_os/**/*.py"],    primary: python-meta-server, secondary: [graph-explorer, clean-code]}
  # CLI factory
  - {globs: ["cli/**/*.py"],              primary: python-meta-server, secondary: [graph-explorer, clean-code]}
  # FastAPI Hub backbone
  - {globs: ["core/web/**/*.py"],         primary: python-meta-server, secondary: [graph-explorer, clean-code]}
  # React + Vite Hub UI
  - {globs: ["core/web/ui/**/*.{ts,tsx}"], primary: react-vite-hub,    secondary: [clean-code]}
  # Claude SDK adapter
  - {globs: ["adapters/claude/**/*.py"],  primary: claude-sdk-integration, secondary: [graph-explorer, clean-code]}
  # Other adapters (codex / cursor / future)
  - {globs: ["adapters/codex/**/*.py", "adapters/cursor/**/*.py"], primary: graph-explorer, secondary: [clean-code, thinking_os]}
  # Hook scripts + helpers
  - {globs: ["core/hooks/*.sh"],          primary: meta-engineering, secondary: [clean-code, thinking_os]}
  - {globs: ["core/hooks/_helpers/*.py"], primary: meta-engineering, secondary: [clean-code, thinking_os]}
  # Authoring infrastructure
  - {globs: ["templates/**/stack.yaml"],  primary: meta-engineering, secondary: [thinking_os, clean-code]}
  - {globs: ["core/hooks/registry.yaml"], primary: meta-engineering, secondary: [thinking_os, clean-code]}

# No Makefile targets — meta-stack inherits the root Makefile.
makefile_targets: []
