# Scaffold boundary for the django stack.
# Schema: docs/governance/scaffold-boundary-contract.md

version: 1
stack: django

roots:
  - backend/

file_patterns:
  - "backend/**/*.py"

imports_from:
  - shared/
  - shared/types/
  - shared/contracts/

forbids_writing_in:
  - frontend/
  - mobile/
  - ai-service/

notes:
  - "Apps under backend/<app>/ — services own writes, selectors own reads."
  - "Migrations append-only; data migrations require forwards + reverse."
