version: 1
id: go-fiber
label: "Go + Fiber (gofiber/fiber v2) + PostgreSQL"
category: backend
primary_skill: go-fiber
skills: [go-fiber]

# These substitution keys are joined across stacks by the aggregator via
# _derive_substitutions (joined on " | "). VERIFY_BACKEND_* override the
# "(none)" defaults from base.yaml.
substitutions:
  DOMAIN_ROUTES: "Backend→`docs/playbooks/fiber-service.md`"
  SKILL_ROUTES: "Backend→`go-fiber`"
  ENGINEERING_RULE_ROUTING: "Backend→`docs/engineering/fiber-rules.md`, Error format→`docs/api-contracts/error-format.md`"
  TOOL_ROUTING_IMPL: "`lint-backend`, `test-backend`"
  VERIFY_BACKEND_GLOB: "`backend/`"
  VERIFY_BACKEND_SUITES: "lint-backend + test-backend"
  VERIFY_BACKEND: "`cd backend && go vet ./... && go test ./...`"
  QUICK_ROUTING: |-
    - Backend / API task → [Fiber Service Playbook](./playbooks/fiber-service.md)
  STACK_REF_CODES: |-
    - `REF:PLAYBOOK-FIBER` → `./playbooks/fiber-service.md`
    - `REF:FIBER-RULES` → `./engineering/fiber-rules.md`

ref_codes:
  - {code: "REF:PLAYBOOK-FIBER", path: "./playbooks/fiber-service.md", desc: "Fiber service playbook"}
  - {code: "REF:FIBER-RULES",    path: "./engineering/fiber-rules.md",  desc: "Fiber engineering rules"}

routing_entries:
  - "Backend / API task → [Fiber Service Playbook](./docs/playbooks/fiber-service.md)"

rules:
  - {file: rules/backend.md, globs: ["backend/**/*.go"]}

makefile_targets:
  - {name: lint-backend, cmd: "cd backend && go vet ./... && golangci-lint run"}
  - {name: test-backend, cmd: "cd backend && go test ./..."}

dimensions:
  - {name: "Fiber handler",    read_files: ["docs/playbooks/fiber-service.md", "docs/engineering/fiber-rules.md"]}
  - {name: "Middleware / auth", read_files: ["docs/engineering/fiber-rules.md", "docs/playbooks/security-review.md"]}
  - {name: "Request validation / DTO", read_files: ["docs/engineering/fiber-rules.md", "docs/api-contracts/error-format.md"]}

skill_enforcement:
  - {globs: ["backend/**/*.go"], primary: go-fiber, secondary: [clean-code]}
