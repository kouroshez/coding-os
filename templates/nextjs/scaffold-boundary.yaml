# Scaffold boundary for the nextjs stack.
# Schema: docs/governance/scaffold-boundary-contract.md
# SSOT for what `frontend/` may write, read, or import.

version: 1
stack: nextjs

roots:
  - frontend/

file_patterns:
  - "frontend/**/*.ts"
  - "frontend/**/*.tsx"
  - "frontend/**/*.js"
  - "frontend/**/*.jsx"
  - "frontend/**/*.css"

imports_from:
  - shared/
  - shared/types/
  - shared/contracts/

forbids_writing_in:
  - backend/
  - mobile/
  - ai-service/

notes:
  - "Server Component first; client-only files end with `.client.tsx`."
  - "Cross-stack types live in shared/types — never import directly from another stack root."
