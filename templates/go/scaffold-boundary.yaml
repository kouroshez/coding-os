# Scaffold boundary for the go stack (stdlib + chi).
# Schema: docs/governance/scaffold-boundary-contract.md

version: 1
stack: go

roots:
  - backend/
  - cmd/

file_patterns:
  - "backend/**/*.go"
  - "cmd/**/*.go"
  - "internal/**/*.go"

imports_from:
  - shared/
  - shared/types/
  - shared/contracts/

forbids_writing_in:
  - frontend/
  - mobile/
  - ai-service/

notes:
  - "Hexagonal: cmd → internal handler → service → repo."
  - "Race detector mandatory on CI (`go test -race`)."
