version: 1
id: cursor
label: "Cursor IDE (Agent)"

presence:
  signal: hook_timestamps
  hub_glyph: "Cr"
  hub_color: "#6366f1"
  presence_events:
    - SessionStart
    - UserPromptSubmit
    - PreToolUse
    - PostToolUse
    - Stop
settings_file: ".cursor/hooks.json"
hooks_dir: ".cursor/hooks"
rules_dir: ".cursor/rules"
skills_dir: ".cursor/skills"
commands_dir: ".cursor/commands"
sourced_hooks: [cos-env.sh]
supports_rules: true
supports_settings_json: true
install_script: install.sh

# Env vars the Cursor IDE runtime exports.  Keeps agent detection in
# cli/board_commands.py data-driven (rule #11) and matches the priority
# in core/hooks/cos-env.sh.
runtime_env_markers:
  - CURSOR_AGENT
  - CURSOR_PROJECT_DIR
  - CURSOR_TRACE_ID
  - CURSOR_VERSION

# MCP — project `.cursor/mcp.json`.
mcp_launch:
  loader: cursor_mcp_json
  config_paths:
    - scope: project
      path: .cursor/mcp.json

default_settings: {}

# Rendered as native Cursor hooks (version + camelCase keys).
hook_registry_output: hooks.cursor.template.json

# Cursor supports Shell + Write + Task matchers on pre/postToolUse.
# We map Claude registry matchers as:
#   Bash -> Shell
#   Write|Edit|MultiEdit|TodoWrite -> Write
#   Skill -> Task
hook_capabilities:
  PreToolUse:
    matchers: [Bash, "Write|Edit", "Write|Edit|MultiEdit", Skill]
  PostToolUse:
    matchers: [Bash, "Write|Edit", "Write|Edit|MultiEdit", Skill]
  Stop:
    matchers: [""]
  SessionStart:
    matchers: [startup, "compact|resume", resume]
  UserPromptSubmit:
    matchers: [""]

# Native Cursor-only events not present in Claude registry names.
cursor_native_hooks:
  preCompact:
    - script: cursor-precompact-dispatch.sh

# Coalesce high-volume matcher groups via dispatchers so execution stays
# deterministic (Cursor can run multiple matching hooks independently).
hook_dispatchers:
  - event: PreToolUse
    matcher: Bash
    script: cursor-pretool-dispatch.sh
    delegates:
      - block-secrets.sh
      - block-dangerous-commands.sh
      - block-uv-heredoc.sh
      - enforce-verify.sh
  - event: PreToolUse
    matcher: "Write|Edit"
    script: cursor-pretool-write-dispatch.sh
    status_message: "🧷 Running write/edit enforcement chain..."
    delegates:
      - block-secrets.sh
      - block-bad-patterns.sh
      - block-protected-files.sh
      - block-migration-conflict.sh
      - block-hardcoded-literals.sh
      - enforce-template.sh
      - thinking_os-gate.sh
      - enforce-task-start.sh
      - enforce-doc-anchor.sh
      - enforce-memory-check.sh
      - enforce-skill.sh
      - enforce-zoom.sh
      - enforce-graph-context.sh
      - enforce-rename-plan.sh
      - validate-task-frontmatter.sh
      - enforce-wip-limit.sh
      - warn-template-drift.sh
      - enforce-anti-ambiguity.sh
  - event: SessionStart
    matcher: startup
    script: cursor-sessionstart-dispatch.sh
    status_message: "🚀 Loading session context + MCP health..."
    delegates:
      - session-context.sh
      - warn-mcp-down.sh
      - remind-daily.sh
  - event: SessionStart
    matcher: "compact|resume"
    script: cursor-sessionstart-dispatch.sh
    status_message: "🔄 Recovering workflow context + MCP health..."
    delegates:
      - session-context.sh
      - warn-mcp-down.sh
      - remind-daily.sh
  - event: Stop
    matcher: ""
    script: cursor-stop-dispatch.sh
    status_message: "📝 Finalizing session recap + memory enrichment..."
    timeout: 5000
    delegates:
      - session-end.sh
      - check-capture-worked.sh
  - event: PostToolUse
    matcher: Bash
    script: remind-learn-validate.sh
    delegates:
      - remind-learn-validate.sh
  - event: PostToolUse
    matcher: "Write|Edit"
    script: cursor-posttool-write-dispatch.sh
    status_message: "📎 Post-write observability + reminders..."
    delegates:
      - capture-observation.sh
      - auto-reindex-docs.sh
      - capture-work-log.sh
      - auto-task-sync.sh
      - lint-task.sh
      - verify-changed-file.sh
      - regen-reminder.sh
      - test-first-reminder.sh
      - doc-sync-reminder.sh
      - check-agents-md-size.sh
      - check-agents-md-refs.sh
      - remind-dogfood.sh
      - track-discovery.sh
