[project]
name = "coding-os"
version = "0.3.0"
description = "Agent-agnostic cognitive operating system for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27.0",
    "pydantic>=2.12.5",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "jsonschema>=4.17.0",
]

[project.optional-dependencies]
# RAG (Retrieval-Augmented Generation) — semantic search via local embeddings.
# Install with: uv sync --extra rag
rag = [
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
]

# graph_os — Phase I knowledge graph subsystem.
# Pinned deliberately (plan P-I-11): grammar / Kùzu upgrades change AST
# shape and invalidate the graph, so upgrades are their own slice.
# Install with: uv sync --extra graph_os
graph_os = [
    "sentence-transformers>=2.7.0",
    "numpy>=1.24.0,<3.0.0",
    "tree-sitter>=0.22.0,<0.25.0",
    "tree-sitter-python>=0.21.0,<0.24.0",
    "tree-sitter-typescript>=0.21.0,<0.24.0",
    "tree-sitter-bash>=0.21.0,<0.24.0",
    "tree-sitter-yaml>=0.6.1,<0.8.0",
    "kuzu>=0.7.1,<0.11.0",
]

# board_os — Phase L Scrumban web viewer (cos board --web).
# Install with: uv sync --extra board_os
board_os = [
    "aiohttp>=3.9.0",
    "watchdog>=4.0.0",
]

# web — S4 unified HTTP backbone (FastAPI + uvicorn + SSE).
# Install with: uv sync --extra web
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
]

# claude-sdk — Claude-adapter-only: real sub-agent dispatch via claude-agent-sdk.
# Scope: adapters/claude/sdk_dispatcher.py. core/ stays agent-agnostic.
# Other adapters (codex, cursor, ...) fall back to the default DB-only dispatcher.
# Install with: uv sync --extra claude-sdk
claude-sdk = [
    # 2026-05-04: pin floor to 0.1.73 (latest); cap below 0.2 — major bump
    # would change SDK shape and invalidate dispatcher assumptions.
    "claude-agent-sdk>=0.1.73,<0.2.0",
    "anyio>=4.0.0",
]

[project.scripts]
cos = "cli.main:cli"
coding-os = "cli.main:cli"
cos-nightly = "scheduled.nightly:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# v0.2: editable install. cli lives at repo root; the three OS subsystems
# (thinking_os, graph_os, board_os) and web live under core/. Listed
# explicitly so `from thinking_os.database import X` works after `uv sync`
# without sys.path hacks.
packages = [
    "cli",
    "thinking_os",
    "thinking_os.tools",
    "thinking_os.dispatchers",
    "graph_os",
    "graph_os.backends",
    "graph_os.extractors",
    "graph_os.groups",
    "graph_os.ingest",
    "graph_os.tools",
    "graph_os.viewer",
    "board_os",
    "web",
    "web.routes",
    "scheduled",
]

[tool.setuptools.package-dir]
"thinking_os" = "core/thinking_os"
"graph_os" = "core/graph_os"
"board_os" = "core/board_os"
"web" = "core/web"
"scheduled" = "core/scheduled"

[tool.pytest.ini_options]
testpaths = ["core/thinking_os/tests", "core/graph_os/tests", "tests"]
markers = [
    "slow: tests that scaffold sandboxes or regenerate the manifest (~30s+)",
    "sdk_e2e: real claude-agent-sdk dispatch tests — require ANTHROPIC_API_KEY (nightly only)",
]
