[project]
name = "coding-os"
version = "0.3.12"
description = "The cognitive operating system that gives AI agents memory, structure, and discipline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27.0",
    "pydantic>=2.12.5",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "jsonschema>=4.17.0",
    # Web Hub (FastAPI + uvicorn + SSE) — moved from optional `[web]`
    # extra to core because `cos hub start` is now a first-class entry
    # point used by every agent UX flow.  Without these in core, a
    # bare `uv tool install --editable .` produces a cos binary that
    # crashes on `cos hub start` with ModuleNotFoundError: fastapi.
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    # claude-agent-sdk — same reasoning as fastapi: the Hub's Cognition
    # tab reads Claude SDK transcripts via project_key_for_directory()
    # regardless of which adapter is the active agent, so a force
    # reinstall of `cos` without --extra claude-sdk would wipe the
    # package and the panel would render "claude_agent_sdk not installed".
    # P8 (no adapter-SDK imports from core/) was already softened by
    # presence.py + cognition.py reading the transcript format directly;
    # promoting the dep finishes that pragmatic decision instead of
    # leaving a half-broken contract.
    "claude-agent-sdk>=0.2.110,<0.3.0",
    "anyio>=4.0.0",
    # graph_os community detection (Graph tab "Communities" view +
    # cos_graph_communities). Pure-python and small; without it in core the
    # hub's tool venv silently renders an empty Communities canvas — the
    # detector import-guards networkx and returns [] (TASK-864).
    "networkx>=3.0",
]
authors = [
    { name = "Kourosh Ebrahimzadeh", email = "info@coding-os.dev" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ai", "coding-agent", "mcp", "llm", "cli", "hexagonal", "claude", "codex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

[project.optional-dependencies]
# RAG (Retrieval-Augmented Generation) — semantic search via local embeddings.
# Install with: uv sync --extra rag
rag = [
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
]

# graph_os — Phase I knowledge graph subsystem.
# Grammars bumped to the 0.25 line 2026-05-30 (TASK-049) after the full
# graph_os parity suite stayed green — the overlay (tree_sitter_overlay.py)
# uses only stable API (Language(capsule), Parser(language), node.type/
# byte offsets), so the AST-shape risk flagged by plan P-I-11 did not
# materialise. Caps held to <0.26 so the next minor is again its own slice.
# Backend: SQLite only. Kuzu was removed 2026-05-18 after benchmark
# (10K-1M nodes) showed SQLite with PRAGMA tuning + ANALYZE delivers
# p99 < 30 ms for 5-hop traversal on 1M nodes — well inside the budget.
# Install with: uv sync --extra graph_os
graph_os = [
    "sentence-transformers>=2.7.0",
    "numpy>=1.24.0,<3.0.0",
    # ANN indexes for semantic kNN over graph_node embeddings
    # (graph_os/vec_index.py). usearch = true sublinear HNSW (the scale path);
    # sqlite-vec = SIMD flat fallback. Both optional — absence degrades to the
    # brute-force scan.
    "usearch>=2.16",
    "sqlite-vec>=0.1.9",
    "tree-sitter>=0.25.0,<0.26.0",
    "tree-sitter-python>=0.25.0,<0.26.0",
    "tree-sitter-typescript>=0.23.0,<0.26.0",
    "tree-sitter-bash>=0.25.0,<0.26.0",
    "tree-sitter-yaml>=0.6.1,<0.8.0",
    # code_go@v2 ships a full tree-sitter Go path; without this grammar it
    # silently degrades to the regex fallback (loses returns_type /
    # has_param_type / field_of_type / interface-embedding edges).
    "tree-sitter-go>=0.23.0,<0.26.0",
    # code_php@v1 mirrors code_go (tree-sitter primary + regex fallback).
    # Provides language_php() (handles <?php … ?> islands in mixed files).
    "tree-sitter-php>=0.23.0,<0.26.0",
    # .gitignore-aware walk (ingest/base.py). GitIgnoreSpec (pathspec>=0.10)
    # lets the file walk exclude exactly what git ignores; absence degrades
    # to the static DEFAULT_EXCLUDE denylist.
    "pathspec>=0.12.1",
    # Polyglot baseline (extractors/code_generic.py). One table-driven
    # extractor pulls functions/classes from any grammar in its node-type
    # map. Each language below is verified to load with the pinned core and
    # has a _LANG_SPEC row + an EXT_MAP route. (SQL is intentionally absent:
    # its DDL symbols don't fit the function/class model — see TASK-304.)
    "tree-sitter-rust>=0.23.0,<0.26.0",
    "tree-sitter-ruby>=0.23.0,<0.26.0",
    "tree-sitter-java>=0.23.0,<0.26.0",
    "tree-sitter-c>=0.23.0,<0.26.0",
    "tree-sitter-cpp>=0.23.0,<0.26.0",
    "tree-sitter-c-sharp>=0.23.0,<0.26.0",
    "tree-sitter-scala>=0.23.0,<0.26.0",
    "tree-sitter-kotlin>=1.0.0",
    "tree-sitter-lua>=0.4.0",
]

# board_os — Phase L Scrumban web viewer (cos board --web).
# Install with: uv sync --extra board_os
board_os = [
    "aiohttp>=3.9.0",
    "watchdog>=4.0.0",
]

# web — kept as no-op alias so historical `uv sync --extra web` calls
# in scripts / CI keep working.  The actual packages live in core
# `dependencies` above (see comment) because the Hub is no longer
# optional.
web = []

# claude-sdk — kept as no-op alias.  Packages live in core
# `dependencies` above (see comment) because the Hub Cognition tab
# reads Claude SDK transcripts on every project, regardless of which
# adapter happens to be active.  Old scripts / CI calling
# `uv sync --extra claude-sdk` continue to work via this alias.
claude-sdk = []

codex-sdk = [
    "openai-codex>=0.144.4,<0.145.0",
]

[project.scripts]
cos = "cli.main:cli"
coding-os = "cli.main:cli"
cos-nightly = "scheduled.nightly:main"
cos-mcp-start = "cli.mcp_start:main"

[project.urls]
Homepage = "https://github.com/kouroshez/coding-os"
Repository = "https://github.com/kouroshez/coding-os"
Issues = "https://github.com/kouroshez/coding-os/issues"

# All packages live under src/ (Python src-layout — meta-repo P5 dogfood).
# `cli`, `thinking_os`, etc. are still importable at top level via
# [tool.setuptools.package-dir] mapping below — code never says
# `from src.cli...` (that'd leak the source tree shape into imports).

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.27.0",
    # Exact pin: uv.lock is gitignored, so CI resolves this fresh — a floating
    # bound let every new ruff release reformat the world and fail the enforced
    # format gate daily. Bump deliberately together with a format sweep.
    "ruff==0.16.1",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.0",
    "types-jsonschema>=4.0.0",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Ship ONLY the explicit package-data globs below — never auto-include the whole
# package tree (that dragged core/web/ui/node_modules, ~3.8k files, into the
# wheel). TASK-219.
include-package-data = false
# Src-layout: all importable code lives under src/. The three OS subsystems
# (thinking_os, graph_os, board_os) plus web and scheduled live under
# src/core/. Listed explicitly so `from thinking_os.database import X` works
# after `uv sync` without sys.path hacks. `core` and `adapters` are also
# importable as packages because some legacy modules use `from core.X` /
# `from adapters.X` — keep those working until callers migrate.
# NOTE: data-only dirs (core/commands = .md slash-commands, core/hooks =
# .sh hooks; no __init__.py) are intentionally NOT listed — listing a dir
# with no importable package errors the wheel-from-sdist build. Shipping
# their files as wheel data (+ runtime resource resolution) is the
# publish-readiness concern tracked in TASK-077.
packages = [
    "cli",
    "core",
    "core.board_os",
    "core.logging_os",
    "core.graph_os",
    "core.graph_os.backends",
    "core.graph_os.bench",
    "core.graph_os.extractors",
    "core.graph_os.groups",
    "core.graph_os.ingest",
    "core.graph_os.tools",
    "core.graph_os.viewer",
    "core.scheduled",
    "core.thinking_os",
    "core.thinking_os.dispatchers",
    "core.thinking_os.tools",
    "core.web",
    "core.web.routes",
    "thinking_os",
    "thinking_os.tools",
    "thinking_os.dispatchers",
    "graph_os",
    "graph_os.backends",
    "graph_os.extractors",
    "graph_os.groups",
    "graph_os.ingest",
    "graph_os.tools",
    "graph_os.viewer",
    "board_os",
    "web",
    "web.routes",
    "scheduled",
    "adapters",
    "adapters.claude",
    "adapters.codex",
    # Data-only trees made into packages so their non-Python files ship as
    # wheel package-data (their data subdirs are NOT listed as packages — that
    # is the TASK-218 wheel-from-sdist trap). TASK-219.
    "templates",
    "scripts",
]

[tool.setuptools.package-dir]
"cli" = "src/cli"
"core" = "src/core"
"adapters" = "src/adapters"
"thinking_os" = "src/core/thinking_os"
"graph_os" = "src/core/graph_os"
"board_os" = "src/core/board_os"
"web" = "src/core/web"
"scheduled" = "src/core/scheduled"
"templates" = "src/templates"
"scripts" = "src/scripts"

# Ship the non-Python data trees a pip/uvx-installed `cos` resolves at runtime
# via cli/_resources.py (hooks, commands, skills, rules, schemas, agents, board
# configs, workflow docs, adapter templates, stack scaffolds, git-hook bodies).
# TASK-219.
[tool.setuptools.package-data]
# Targeted to the runtime data dirs only — a blanket `**/*.md` would drag in
# core/web/ui/node_modules (thousands of files) and bloat the wheel.
core = [
    "*.json",
    "*.yaml",
    "hooks/*.sh",
    "hooks/_helpers/*.py",
    "hooks/registry.yaml",
    "commands/**/*.md",
    "skills/**/*",
    "rules/*.md",
    "scripts/*.sh",
    "schemas/*.json",
    "docs/**/*.md",
    "thinking_os/agents/**/*",
    "thinking_os/presets/*.yaml",
    "thinking_os/situations/*.yaml",
    "thinking_os/roles/*.yaml",
    "board_os/*.yaml",
]
adapters = ["**/*"]
templates = ["**/*"]
scripts = ["**/*"]

[tool.setuptools.exclude-package-data]
# The Hub UI tree (node_modules ~3.8k files, dist build output, TS source) is a
# build-time concern, never needed by a pip/uvx-installed `cos init`. Exclude it
# wholesale so the wheel stays lean. TASK-219.
"*" = ["**/node_modules/**", "**/__pycache__/**", "**/*.pyc", "**/dist/**"]
core = ["web/ui/**"]
web = ["ui/**"]

[tool.pytest.ini_options]
testpaths = ["src/core/thinking_os/tests", "src/core/graph_os/tests", "src/core/board_os/tests", "src/core/logging_os/tests", "tests"]
markers = [
    "slow: tests that scaffold sandboxes or regenerate the manifest (~30s+)",
    "real_embeddings: tests that need the real SentenceTransformer model (exempt from the conftest stub)",
    "sdk_e2e: real claude-agent-sdk dispatch tests — require ANTHROPIC_API_KEY (nightly only)",
    "bench: pytest-benchmark micro-benchmarks (run via `make bench`, excluded from normal sweeps)",
]
# Useful defaults; override with -p no:cacheprovider etc on CI if needed.
addopts = "-ra --strict-markers"
# Hard ceiling so a hung test (deadlocked subprocess, infinite poll) fails
# loud instead of stalling the whole suite. 300s clears the slowest legit
# test; genuinely-slow tests can override with @pytest.mark.timeout(N).
timeout = 300
filterwarnings = [
    # Demote known harmless deprecations from upstream deps.
    "ignore::DeprecationWarning:google.*",
    "ignore::DeprecationWarning:pydantic.*",
]

# ============================================================================
# ruff — single tool for lint + format. Replaces flake8 + black + isort.
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [
    ".coding-os",
    ".build",
    "archive",
    "*.md",                  # ruff 0.16 formats python inside md fences; docs-lint owns markdown
    "tests/golden",          # generated snapshots
    "src/templates/*/scaffold",  # consumer-shipped files; downstream owns style
    "src/core/web/ui/node_modules",
    "src/core/web/ui/dist",
]

[tool.ruff.lint]
# Keep the rule set tight on the first stable release; expand as we
# clear baseline noise. Documented per group so future contributors
# know why each is on.
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import order)
    "B",      # flake8-bugbear (likely-bug patterns)
    "UP",     # pyupgrade (modern syntax)
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific (mostly correctness)
    # Complexity gates — thresholds in [tool.ruff.lint.mccabe]/[tool.ruff.lint.pylint];
    # pre-existing offenders are baselined in per-file-ignores (shrink, never grow).
    "C901",   # mccabe cyclomatic complexity
    "PLR0912",# too-many-branches
    "PLR0913",# too-many-arguments
    "PLR0915",# too-many-statements
]
ignore = [
    "E501",   # line-too-long — formatter handles it; long URLs are fine
    "B008",   # function call in default arg — common w/ Click + FastAPI
    "SIM108", # ternary-vs-if — readability is subjective
    # Ambiguous-unicode rules — coding-os is bilingual (Persian + English);
    # Persian text in docstrings/comments/strings is intentional, not a
    # homoglyph attack. These rules would fire forever on legitimate copy.
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
    # Burndown (2026-08-07, tracked in the lint-burndown board task):
    # style-only residue accepted to make `ruff check` a hard CI gate.
    # Remove each entry once its count reaches 0 — never add new ones.
    "SIM105", # try-except-pass vs contextlib.suppress (9 left)
    "SIM102", # collapsible-if (7 left)
    "E741",   # ambiguous single-letter names (7 left)
]
unfixable = [
    "F401",   # unused-import — never auto-remove (could hide intent)
    "F841",   # unused-variable — same
]

[tool.ruff.lint.per-file-ignores]
# E402 — sys.path bootstrap before imports is the established pattern in
# tests, hook helpers, and the CLI's late circular-import-avoiding imports.
"tests/**" = ["B011", "E402"]                  # asserts in tests are fine
"src/core/thinking_os/tests/**" = ["B011", "E402"]
"src/core/graph_os/tests/**" = ["B011", "E402"]
"src/core/board_os/tests/**" = ["B011", "E402"]
"src/core/scheduled/tests/**" = ["E402"]
"src/core/hooks/_helpers/*.py" = ["E402"]
"src/cli/aggregator.py" = ["E402"]
"src/cli/main.py" = ["E402"]
"src/cli/init_command.py" = ["C901", "PLR0912", "PLR0913", "PLR0915"]
"src/cli/adopt_command.py" = ["PLR0913"]
# Relocated verbatim from main.py by the 2026-08-10 split — same code, new home.
"src/cli/_init_phase.py" = ["C901", "PLR0912", "PLR0913", "PLR0915"]
"src/cli/_init_scaffold.py" = ["C901", "PLR0912", "PLR0915"]
"src/cli/_init_world.py" = ["C901", "PLR0912", "PLR0913", "PLR0915"]
"src/cli/_init_preview.py" = ["C901", "PLR0912", "PLR0915"]
"src/cli/stack_registry.py" = ["E402"]
"src/cli/update.py" = ["E402", "C901", "PLR0912"]
"src/cli/_update_manifest.py" = ["C901", "PLR0912"]
"src/core/thinking_os/server.py" = ["E402", "PLR0913"]
"src/core/thinking_os/_tools_task_records.py" = ["PLR0913"]
"src/core/thinking_os/_board_bridge.py" = ["F401"]
"src/cli/_init_boundaries.py" = ["C901"]
# Relocated verbatim from graph.py by the 2026-08-10 split.
"src/core/graph_os/tools/_graph_doctor.py" = ["C901", "PLR0912", "PLR0915"]
"src/core/thinking_os/tools/_dispatch_request.py" = ["PLR0913"]
"src/core/thinking_os/tools/_cognition_supervise.py" = ["PLR0913"]
"src/core/thinking_os/session_summary.py" = ["E402"]
"src/scripts/**" = ["E402"]                    # late imports in scripts are OK
# Bench/demo scripts lean on NamedTemporaryFile(delete=False).name for a
# throwaway path — the held fd is harmless in a short-lived script.
"src/core/graph_os/bench/**" = ["SIM115"]
"src/scripts/graph_demo.py" = ["SIM115"]
"src/templates/**" = ["ALL"]                   # consumer-shipped files
# Complexity baseline (2026-08-08): 101 violations in 40 files at the
# thresholds above. Entries may only shrink — refactor a function below
# threshold, delete its rule here. Never add a file to this list.
"src/adapters/claude/sdk_dispatcher.py" = ["C901", "PLR0912", "PLR0915"]
"src/cli/_board_cli_lifecycle.py" = ["PLR0913"]
"src/cli/db_reset.py" = ["C901", "PLR0912", "PLR0915"]
"src/cli/doctor.py" = ["PLR0913"]
"src/cli/doctor_checks_registry.py" = ["C901"]
# Relocated verbatim from doctor_checks_runtime.py by the 2026-08-11 split.
"src/cli/_doctor_cognition.py" = ["C901", "PLR0912"]
"src/cli/_doctor_hook_coverage.py" = ["C901", "PLR0912", "PLR0915"]
"src/cli/_graph_cli_group.py" = ["C901"]
"src/cli/_graph_cli_query.py" = ["C901", "PLR0915"]
"src/cli/_graph_cli_reindex.py" = ["C901", "PLR0912", "PLR0915"]
"src/cli/hook_renderer.py" = ["C901"]
"src/cli/stack_lint.py" = ["C901", "PLR0912"]
"src/cli/supervision_commands.py" = ["PLR0913"]
"src/cli/verify_since_edit.py" = ["C901"]
"src/core/board_os/config.py" = ["C901", "PLR0912", "PLR0915"]
"src/core/board_os/_mcp_create.py" = ["C901", "PLR0913"]
"src/core/board_os/_mcp_edit.py" = ["PLR0913"]
"src/core/board_os/transition_gates_validator.py" = ["PLR0913"]
"src/core/board_os/workflow.py" = ["C901", "PLR0912", "PLR0913"]
"src/core/graph_os/entry_points.py" = ["C901"]
"src/core/graph_os/extractors/_php_symbols.py" = ["C901", "PLR0915"]
"src/core/graph_os/extractors/_go_symbols.py" = ["PLR0913"]
"src/core/graph_os/extractors/_python_tree_sitter.py" = ["C901"]
"src/core/graph_os/extractors/code_shell.py" = ["C901", "PLR0912"]
"src/core/graph_os/ingest/base.py" = ["C901"]
"src/core/graph_os/tools/_analysis_impact.py" = ["C901"]
"src/core/graph_os/tools/_graph_export.py" = ["C901", "PLR0912"]
"src/core/graph_os/tools/_graph_centrality.py" = ["C901", "PLR0912", "PLR0915"]
"src/core/graph_os/tools/_graph_ranking.py" = ["C901", "PLR0912", "PLR0915"]
"src/core/graph_os/tools/_graph_lookup.py" = ["C901"]
"src/core/graph_os/tools/_graph_similar.py" = ["C901", "PLR0912"]
"src/core/graph_os/tools/_reindex_state.py" = ["PLR0913"]
"src/core/graph_os/tools/reindex_dispatch.py" = ["C901", "PLR0912", "PLR0913"]
"src/core/hooks/_helpers/branch_guard_pr.py" = ["C901", "PLR0912"]
"src/core/hooks/_helpers/doc_sync_check.py" = ["C901", "PLR0912"]
"src/core/thinking_os/capture.py" = ["C901"]
"src/core/thinking_os/concepts.py" = ["C901"]
"src/core/thinking_os/session_enrich.py" = ["C901", "PLR0912"]
# Facade: the part modules decorate the router defined above them.
"src/core/web/routes/cognition.py" = ["E402"]
"src/core/thinking_os/tools/docs.py" = ["PLR0913"]
"src/core/thinking_os/tools/_memory_search.py" = ["C901"]
"src/core/scheduled/nightly.py" = ["C901", "PLR0912", "PLR0915"]
"src/core/web/routes/_board_tasks.py" = ["PLR0913"]
# Relocated verbatim from hub.py by the 2026-08-10 split.
"src/core/web/routes/_hub_init.py" = ["C901", "PLR0912"]
"src/core/web/routes/_hub_init_routes.py" = ["PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 24
max-statements = 100

[tool.ruff.lint.isort]
known-first-party = [
    "cli", "core", "adapters", "scheduled",
    "thinking_os", "graph_os", "board_os", "web",
]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

# ============================================================================
# mypy — type checker. Strict on core subsystems; lenient on adapters/scripts.
# CI runs this informationally for the 0.3 line; promote to required once
# baseline noise is cleared.
# ============================================================================
[tool.mypy]
python_version = "3.10"
strict = false                  # promote per-package below
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
exclude = [
    "archive/",
    "tests/golden/",
    "src/templates/.*/scaffold/",
    "src/core/web/ui/",
    ".coding-os/",
    ".build/",
]

[[tool.mypy.overrides]]
# Strict only on the kernel subsystems we own end-to-end.
module = [
    "thinking_os.tools.*",
    "graph_os.backends.*",
    "board_os.workflow",
    "board_os._workflow_types",
    "board_os._workflow_wip",
    "board_os._workflow_deps",
    "board_os._workflow_frontmatter",
    "board_os._workflow_gates",
]
strict = true

[[tool.mypy.overrides]]
# Untyped third-party stubs we can't fix.
module = [
    "tree_sitter.*",
    "tree_sitter_python.*",
    "tree_sitter_typescript.*",
    "tree_sitter_bash.*",
    "tree_sitter_yaml.*",
    "tree_sitter_go.*",
    "sentence_transformers.*",
    "kuzu.*",                   # retired backend; ignored if anything still imports it
    # Flat sibling imports inside src/core/thinking_os (`from database import …`,
    # `from _server_runtime import …`). They resolve at runtime because the package
    # dir is on sys.path, but mypy runs from the repo root and cannot see them — so
    # every module split multiplied the same import-not-found error. Root fix is a
    # mypy_path with explicit_package_bases (TASK-925); until then, silence the
    # class instead of re-baselining after each split.
    #
    # Names are spelled out because mypy's `*` matches a whole dotted component,
    # never a prefix — the `_tools_*` entry that used to sit here matched nothing
    # and silently let each split add errors. `anthropic` is deliberately absent:
    # a src/core import of an adapter SDK is a P8 violation, and that error is
    # the only thing that reports it.
    "database",
    "_db_paths",
    "_db_migrations",
    "_server_runtime",
    "_agent_markers",
    "_board_bridge",
    "_learning_mining",
    "_learning_store",
    "_tools_docs",
    "_tools_graph_insights",
    "_tools_graph_query",
    "_tools_memory",
    "_tools_routing",
    "_tools_task_flow",
    "_tools_task_records",
    "_tools_tasks",
    "tools.*",
    "advance_role",
    "auto_compose",
    "auto_validate_lessons",
    "background",
    "budget",
    "capture",
    "cognition",
    "cognition_schemas",
    "compress",
    "concepts",
    "dashboard",
    "decay",
    "digest",
    "dispatcher",
    "distill",
    "doc_indexer",
    "embeddings",
    "formula_composer",
    "gate_marker",
    "graph_indexer",
    "impact",
    "memory_gc",
    "migrator_embeddings",
    "precision",
    "record_outcome",
    "repair",
    "retrieval_quality",
    "roles_state",
    "sanitizer",
    "session_enrich",
    "session_observe_worker",
    "session_summary",
    "task_analyzer",
    "task_parser",
    "task_sync",
    "tool_failure_capture",
    "tracing",
    "trajectory_autosnap",
    # Same class, board_os flavour: `from board_os.config import …` resolves at
    # runtime (src/core is on sys.path) but not from the repo root. Splitting
    # workflow.py multiplied the one pre-existing error by each new sibling.
    "board_os.config",
    "board_os.parser",
    "board_os.presence",
    "board_os.sync",
    "board_os.transition_gates",
    "board_os.transition_gates_validator",
    "board_os.transition_gates_cli",
    "board_os.verify_suites",
    "board_os.workflow",
    "thinking_os.database",
    "thinking_os.gate_marker",
    "thinking_os.record_outcome",
    "thinking_os.tools._shared",
    "thinking_os.tools.learning",
]
ignore_missing_imports = true

# ============================================================================
# pytest-cov — coverage reporting (run via `make coverage`).
# ============================================================================
[tool.coverage.run]
source = ["src/core", "src/cli", "src/adapters"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    "src/templates/*",
    "src/scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
fail_under = 62       # measured 63% across all suites 2026-08-08; 1pt noise headroom — ratchet toward 70/80
