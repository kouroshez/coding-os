name: CI

on:
  push:
    branches: [main]
    # Board-sync commits (pure docs/tasks/ churn) carry no code or docs that
    # the gates check — skip the matrix for them to conserve Actions minutes.
    paths-ignore:
      - "docs/tasks/**"
  pull_request:
    branches: [main]
  # Merge queue (pr-mode) — GitHub serializes N agent PRs into main server-side
  # and runs the required CI gate on the queued combination, so "two pass alone,
  # break together" is caught before merge (fixes the rebase thundering-herd).
  # SPEC: docs/playbooks/pr-workflow.md § 11.
  merge_group:
  # Allow manual re-runs without a push.
  workflow_dispatch:
  # Nightly full slow-suite sweep (scaffold sandboxes, background loops).
  schedule:
    - cron: "0 7 * * *"

# Cancel superseded PR runs for the same ref to keep CI minutes sane. NEVER
# cancel a merge_group or push-to-main run — a queued merge-group check must
# complete or the PR can never merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer run on the same ref always supersedes — the older tree's
  # verdict is irrelevant once a newer commit exists (trunk-based).
  cancel-in-progress: true

# Default to restrictive permissions; jobs that need more bump explicitly.
permissions:
  contents: read

jobs:
  # ============================================================
  # Lint — fast Python + frontend gate. Runs once, always.
  # ============================================================
  lint:
    name: Lint (ruff + mypy + eslint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install Python deps
        run: uv sync --extra rag
      - name: ruff check
        run: uv run ruff check src/ tests/
        # Hard gate since the 2026-08-07 baseline burndown: zero findings
        # at flip time. The three style rules still ignored (SIM105 /
        # SIM102 / E741) are listed with counts in pyproject.toml and
        # tracked on the board — shrink that list, never grow it.
      - name: ruff format --check
        run: uv run ruff format --check src/ tests/
      - name: mypy ratchet (core)
        run: uv run python src/scripts/mypy_ratchet.py
        # Count-ratchet gate: fails when the mypy error count rises above
        # the committed BASELINE. Promotion path: docs/engineering/ci-gates.md.

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/core/web/ui/package-lock.json
      - name: Install frontend deps
        working-directory: src/core/web/ui
        run: npm ci
      - name: TypeScript typecheck
        working-directory: src/core/web/ui
        run: npm run typecheck
      - name: ESLint
        working-directory: src/core/web/ui
        run: npm run lint --if-present

  # ============================================================
  # Test (Python) — matrix across 3.10 / 3.11 / 3.12 × OS.
  # ============================================================
  test-python:
    name: pytest (${{ matrix.os }} · py${{ matrix.python }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # macOS bills at 10× Actions minutes, so it ran on every push + every
        # release-please PR sync and drained the monthly quota. Linux is
        # case-sensitive — the stronger per-push gate (it catches the path-case
        # bugs macOS's case-insensitive FS HIDES). per-push = Linux × 3 py;
        # macOS moved to the nightly `test-python-macos` job below.
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install deps
        run: uv sync --extra rag --extra graph_os
      - name: Install bash 5 (macOS)
        if: runner.os == 'macOS'
        run: brew install bash
      - name: Subsystem — thinking_os
        run: uv run --extra rag pytest src/core/thinking_os/tests/ -q
      - name: Subsystem — graph_os
        run: uv run --extra graph_os pytest src/core/graph_os/tests/ -q
      - name: Subsystem — board_os
        run: uv run --extra rag --with aiohttp --with pytest-asyncio pytest src/core/board_os/tests/ -q
      - name: Subsystem — logging_os
        run: uv run --extra rag pytest src/core/logging_os/tests/ -q
      - name: Subsystem — scheduled
        run: uv run --extra rag pytest src/core/scheduled/tests/ -q
      - name: Cross-cutting tests (selected; skip slow scaffold tests)
        run: uv run pytest tests/ -q -m 'not slow'

  # ============================================================
  # macOS smoke — nightly only (schedule/manual). macOS bills at 10×
  # Actions minutes, so it stays off the per-push / per-PR path. Single
  # Python (3.12) keeps the daily cost bounded; widen the matrix here if
  # macOS-specific regressions start slipping through. NOT in ci-pass needs,
  # so a per-push CI Pass never waits on it.
  # ============================================================
  test-python-macos:
    name: pytest (macos-latest · py3.12) [nightly]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: lint
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install deps
        run: uv sync --extra rag --extra graph_os
      - name: Install bash 5 (macOS)
        run: brew install bash
      - name: Subsystem — thinking_os
        run: uv run --extra rag pytest src/core/thinking_os/tests/ -q
      - name: Subsystem — graph_os
        run: uv run --extra graph_os pytest src/core/graph_os/tests/ -q
      - name: Subsystem — board_os
        run: uv run --extra rag --with aiohttp --with pytest-asyncio pytest src/core/board_os/tests/ -q
      - name: Subsystem — logging_os
        run: uv run --extra rag pytest src/core/logging_os/tests/ -q
      - name: Subsystem — scheduled
        run: uv run --extra rag pytest src/core/scheduled/tests/ -q
      - name: Cross-cutting tests (selected; skip slow scaffold tests)
        run: uv run pytest tests/ -q -m 'not slow'

  # ============================================================
  # Coverage gate — kernel suites under pytest-cov. fail_under lives
  # in pyproject.toml ([tool.coverage.report]); diff-cover addition-
  # ally gates NEW code on PRs at 80% so total coverage can only
  # ratchet up. Runs one Python (3.12) — the matrix job already
  # proves version compat; coverage % is version-independent.
  # ============================================================
  coverage:
    name: coverage (fail_under + diff-cover)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # diff-cover diffs against the PR base — needs real history.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: All CI suites under pytest-cov (gate = fail_under in pyproject.toml)
        run: make coverage
      - name: Diff coverage — new code ≥80% (PRs only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          uv run --with diff-cover diff-cover coverage.xml \
            --compare-branch "origin/${{ github.base_ref }}" \
            --fail-under 80

  # ============================================================
  # Modularity safety net — the @slow re-render guards the matrix
  # job skips (golden parity, rules-fresh) PLUS the fast skill +
  # all-stacks render smokes. Gates every PR so a botched re-render
  # or a stale golden can no longer ship silently to consumers.
  # ============================================================
  test-modularity:
    name: modularity safety net (golden + render smoke)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install deps
        run: uv sync --extra rag --extra graph_os
      - name: Referential-integrity + all-stacks render smoke + toggle round-trips (fast)
        run: uv run pytest tests/test_skill_ref_integrity.py tests/test_all_stacks_render_smoke.py tests/test_modularity_toggle.py -q
      - name: Golden parity + rules freshness (the @slow re-render guards)
        run: uv run pytest tests/test_golden_parity.py tests/test_rules_fresh.py -q
      - name: Scaffold-manifest freshness (all 56 single-stack sections)
        # Golden-parity only covers the 6 representative sections; the manifest
        # is the single-stack scaffold contract for ALL stacks. Its freshness
        # test is @slow (builds sandboxes) so it was nightly-only — drift for the
        # ~50 non-golden stacks shipped to main uncaught (audit INIT-1).
        run: uv run pytest tests/test_manifest_fresh.py -q

  # ============================================================
  # Verification-Matrix suites — the cli / adapters / doctor
  # suites AGENTS.md § Verification Matrix prescribes are
  # module-level @slow (scaffold sandboxes / subprocess), so the
  # test-python job's `-m 'not slow'` deselects them. Run them
  # once on a single runner so a cli/adapter/doctor regression is
  # caught on the PR that introduces it — not only in the nightly
  # sweep (audit F-TST-2: the matrix contract was aspirational on
  # PRs, the root cause of the 2 prior CI-hidden RED breakages).
  # The heaviest scaffold suites (test_template_scaffold,
  # test_background, add/remove-stack) intentionally stay nightly.
  # ============================================================
  test-matrix:
    name: verification-matrix suites (cli + adapters + doctor)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install deps
        run: uv sync --extra rag --extra graph_os
      - name: cli + adapters + doctor matrix suites
        run: uv run --extra rag --extra graph_os pytest tests/test_cli.py tests/test_adapters.py tests/test_adapter_parity.py tests/test_doctor.py -q

  # ============================================================
  # Nightly full slow-suite — scaffold sandboxes + background
  # loops + add/remove-stack round-trips. Schedule-only (too slow
  # for every PR); the cheap subset is gated by test-modularity.
  # ============================================================
  test-slow-nightly:
    name: nightly slow suite
    if: github.event_name == 'schedule'
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install deps
        run: uv sync --extra rag --extra graph_os
      - name: make test-slow
        run: make test-slow
      - name: Graph phantom-regression gate (full reindex — nightly-only, too slow per-PR)
        # always(): an independent signal, so a `make test-slow` failure must not
        # shadow it — before this it had never executed once in 72 runs.
        if: always()
        # Builds the graph from scratch (~44K nodes, minutes) then fails if
        # orphaned_phantom nodes exceed the baseline — the real "graph rotted"
        # signal (the 70 cursor-node spike class). A raw healthy:false gate was
        # rejected: it is permanently red from benign external-unresolved imports.
        run: |
          uv run cos graph-reindex --force -j 4 || uv run cos graph-reindex --force
          uv run python src/scripts/check_graph_phantoms.py

  # ============================================================
  # Hook syntax — bash -n + shellcheck on every src/core/hooks/*.sh
  # ============================================================
  test-hooks:
    name: shellcheck + bash -n
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: bash -n on every hook
        run: |
          fail=0
          for f in src/core/hooks/*.sh src/core/scripts/*.sh; do
            bash -n "$f" || fail=1
          done
          exit $fail
      - name: shellcheck (warning level)
        run: shellcheck -S warning src/core/hooks/*.sh src/core/scripts/*.sh
        # Hard gate since 2026-08-08 — the tree was clean at flip time.

  # ============================================================
  # Frontend tests (vitest + build).
  # ============================================================
  test-frontend:
    name: vitest + build
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/core/web/ui/package-lock.json
      - name: Install
        working-directory: src/core/web/ui
        run: npm ci
      - name: Test
        working-directory: src/core/web/ui
        run: npm test -- --run
      - name: Build
        working-directory: src/core/web/ui
        run: npm run build

  # ============================================================
  # Docs lint — markdown structure + link integrity.
  # ============================================================
  docs-lint:
    name: docs-lint
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so docs-lint --changed can diff vs the PR base
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: uv sync
      - name: docs-lint
        run: make docs-lint
        # Required: the internal-link + anchor + symlink-dir audit is a
        # hard gate (a broken doc link or a symlinked docs/ subdir fails
        # CI). The SSOT frontmatter sub-check inside the target stays
        # advisory until that baseline is cleared.
      - name: docs-lint strict on changed docs
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="$PR_BASE_SHA"
          [ -n "$base" ] || base="$PUSH_BEFORE_SHA"
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$base" 2>/dev/null; then
            COS_DOCS_LINT_STRICT=1 COS_DOCS_LINT_BASE="$base" bash src/core/scripts/docs-lint.sh --changed
          else
            echo "docs-lint --changed: no resolvable base; skipping strict changed-docs gate"
          fi
        # NEW/CHANGED docs must satisfy the full SSOT header contract (strict);
        # the pre-existing backlog stays advisory via the make docs-lint step above.
      - name: Task-file lint (no duplicate frontmatter)
        run: uv run cos task-validate
        # Required: a duplicated frontmatter block makes sync_one reject the
        # file outright, silently freezing its board row (TASK-891 read P0 in
        # the file and P2 on the board). The detector already existed and was
        # wired to nothing, which is why it recurred three times — repair with
        # `cos task-validate --repair`.
      - name: OpenAPI snapshot in sync
        run: uv run python src/scripts/dump_openapi.py --check
        # Required: a drifted Hub API contract must regenerate the
        # snapshot (python src/scripts/dump_openapi.py) before merge.
      - name: Board↔git coherence (no uncommitted task files) — TASK-436
        run: |
          drift="$(git status --porcelain -- docs/tasks)"
          if [ -n "$drift" ]; then
            echo "board↔git drift — docs/tasks has uncommitted file(s):"
            echo "$drift"
            exit 1
          fi
          echo "board↔git coherence OK — every docs/tasks file is committed"
        # Required: the same drift the cos doctor board.git_tracked check + the
        # nightly task-filer guard, asserted on the checked-out tree (P6).

  # ============================================================
  # Required-checks gate — every job above must succeed.
  # Branch protection should require this single check.
  # ============================================================
  ci-pass:
    name: CI Pass
    if: always()
    needs:
      [
        lint,
        test-python,
        coverage,
        test-hooks,
        test-frontend,
        test-modularity,
        test-matrix,
        docs-lint,
        test-slow-nightly,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs succeeded
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] \
             || [[ "${{ needs.test-python.result }}" != "success" ]] \
             || [[ "${{ needs.coverage.result }}" != "success" ]] \
             || [[ "${{ needs.test-hooks.result }}" != "success" ]] \
             || [[ "${{ needs.test-frontend.result }}" != "success" ]] \
             || [[ "${{ needs.test-modularity.result }}" != "success" ]] \
             || [[ "${{ needs.test-matrix.result }}" != "success" ]] \
             || [[ "${{ needs.docs-lint.result }}" != "success" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          # Nightly-only: 'skipped' is the correct result on push/PR runs, but a
          # real failure must not report green (it did — run 31246768706).
          if [[ "${{ needs.test-slow-nightly.result }}" != "success" \
             && "${{ needs.test-slow-nightly.result }}" != "skipped" ]]; then
            echo "Nightly slow suite failed (result: ${{ needs.test-slow-nightly.result }})."
            exit 1
          fi
          echo "All required jobs passed."
