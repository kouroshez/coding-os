name: release-please

# Reads Conventional Commits on `main` and maintains a standing
# "release" PR that bumps the version + updates CHANGELOG.md. Merging
# that PR tags the release, which sets releases_created=true and fires
# the publish-pypi job (Trusted Publishing). The publish step no-ops on
# every ordinary push because the gate is false.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_ref:
        description: >-
          Recovery hatch: git ref (tag) to build and publish to PyPI when the
          automatic gate could not fire — e.g. an Actions outage swallowed the
          push event and the release was tagged by hand. Leave blank for a
          normal run.
        required: false
        default: ""

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # config + manifest live at the repo root.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Prefer an explicit PAT (RELEASE_PLEASE_TOKEN secret) so the
          # release PR ALSO triggers downstream workflows on its push
          # event; default GITHUB_TOKEN cannot do that. Falls back to
          # GITHUB_TOKEN when the PAT secret is not set. If you see
          # "Bad credentials" here, the cause is one of:
          #   (a) repo Settings → Actions → General → Workflow
          #       permissions = "Read repository contents" (read-only).
          #       Change to "Read and write" AND check
          #       "Allow GitHub Actions to create and approve pull
          #       requests". This is the most common cause.
          #   (b) The RELEASE_PLEASE_TOKEN secret is set but invalid /
          #       expired / lacks `contents:write` + `pull_requests:write`
          #       scopes. Regenerate the PAT.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # Publishes wheel + sdist to PyPI via Trusted Publishing (OIDC, no
  # token). Fires when release-please created a release on this push
  # (releases_created == 'true'), or when publish_ref names a tag to
  # recover a release whose automatic gate never fired. Prerequisite:
  # register this repo as a trusted publisher on the PyPI 'coding-os'
  # project once. Every ordinary push leaves both conditions false.
  publish-pypi:
    needs: release-please
    # `!cancelled()` keeps the manual hatch reachable when the
    # release-please job itself failed — the exact case it recovers from.
    if: >-
      ${{ !cancelled()
          && (needs.release-please.outputs.releases_created == 'true'
              || inputs.publish_ref != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      contents: write # upload SBOM + signatures to the GitHub release
      id-token: write # OIDC: Trusted Publishing, Sigstore, and provenance
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # github.sha, not github.ref: a branch name resolves to main's tip
          # at job start, which may already be past the release commit.
          ref: ${{ inputs.publish_ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The Hub SPA is a build INPUT of the wheel: `cos hub start` serves it
      # from <web package>/ui/dist, and dist/ is gitignored, so a wheel built
      # without this step installs a Hub that answers "SPA not built yet".
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/core/web/ui/package-lock.json
      - name: Build the Hub SPA
        working-directory: src/core/web/ui
        run: |
          npm ci
          npm run build
      - name: Fail if the SPA build produced nothing
        run: test -f src/core/web/ui/dist/index.html
      # Hash-pinned, not just version-pinned: this frontend produces the wheel
      # that is then signed and attested, so it is the build input worth
      # pinning hardest. Bump via the recipe in the requirements file.
      - run: pip install --require-hashes -r .github/requirements-build.txt
      - run: python -m build
      # Gates the artifact that is about to be signed and uploaded, not a
      # rebuild of it — a published wheel cannot be replaced (PyPI refuses
      # re-upload of a yanked version), so this must fail before the upload.
      - name: Verify the built wheel carries the SPA
        env:
          COS_WHEEL_PATH: dist/*.whl
        run: |
          pip install pytest
          python -m pytest tests/test_wheel_contents.py -q -m ''
      # --- supply-chain evidence (docs/engineering/ci-gates.md) ---------
      # SLSA build provenance for the exact artifacts published to PyPI.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: dist/*
      # SPDX SBOM of the built distribution, attached to the GitHub release.
      # output-file must land in an EXISTING directory — the action does not
      # create the parent and fails ENOENT (it did, on the v0.3.10 publish).
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: coding-os-sbom.spdx.json
          output-file: coding-os-sbom.spdx.json
      # Sigstore keyless signatures for wheel + sdist (bundles land in dist/).
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: dist/*.whl dist/*.tar.gz
      - name: Move signature bundles out of dist/
        # gh-action-pypi-publish uploads EVERY file in packages-dir, so a
        # .sigstore.json left beside the wheel fails the whole publish with
        # "Unknown distribution format" (it did, on the v0.3.10 recovery run).
        run: |
          mkdir -p signatures
          mv dist/*.sigstore.json signatures/
          ls -l dist signatures
      - name: Stage the provenance attestation as a release asset
        # attest-build-provenance only pushes to the attestations API; nothing
        # reaches the release page, so Scorecard's Signed-Releases check caps
        # at 8/10 ("does not have provenance") until an *.intoto.jsonl asset
        # exists. The bundle is the Sigstore-wrapped in-toto SLSA v1 statement
        # that `gh attestation verify` consumes — emit it single-line so the
        # .jsonl extension is literally true.
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: jq -c . "$BUNDLE" > coding-os.intoto.jsonl
      - name: Attach SBOM + signature bundles to the GitHub release
        # The trigger is a push (not a release event), so auto-upload paths
        # in the actions above don't fire — attach the evidence explicitly.
        if: needs.release-please.outputs.tag_name != '' || inputs.publish_ref != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.publish_ref || needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" coding-os-sbom.spdx.json --clobber
          gh release upload "$TAG" signatures/*.sigstore.json --clobber
          gh release upload "$TAG" coding-os.intoto.jsonl --clobber
      # ------------------------------------------------------------------
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
