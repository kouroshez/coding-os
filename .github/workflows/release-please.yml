name: release-please

# Reads Conventional Commits on `main` and maintains a standing
# "release" PR that bumps the version + updates CHANGELOG.md. Merging
# that PR tags the release, which sets releases_created=true and fires
# the publish-pypi job (Trusted Publishing). The publish step no-ops on
# every ordinary push because the gate is false.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_ref:
        description: >-
          Recovery hatch: git ref (tag) to build and publish to PyPI when the
          automatic gate could not fire — e.g. an Actions outage swallowed the
          push event and the release was tagged by hand. Leave blank for a
          normal run.
        required: false
        default: ""

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # config + manifest live at the repo root.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Prefer an explicit PAT (RELEASE_PLEASE_TOKEN secret) so the
          # release PR ALSO triggers downstream workflows on its push
          # event; default GITHUB_TOKEN cannot do that. Falls back to
          # GITHUB_TOKEN when the PAT secret is not set. If you see
          # "Bad credentials" here, the cause is one of:
          #   (a) repo Settings → Actions → General → Workflow
          #       permissions = "Read repository contents" (read-only).
          #       Change to "Read and write" AND check
          #       "Allow GitHub Actions to create and approve pull
          #       requests". This is the most common cause.
          #   (b) The RELEASE_PLEASE_TOKEN secret is set but invalid /
          #       expired / lacks `contents:write` + `pull_requests:write`
          #       scopes. Regenerate the PAT.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # Publishes wheel + sdist to PyPI via Trusted Publishing (OIDC, no
  # token). Fires when release-please created a release on this push
  # (releases_created == 'true'), or when publish_ref names a tag to
  # recover a release whose automatic gate never fired. Prerequisite:
  # register this repo as a trusted publisher on the PyPI 'coding-os'
  # project once. Every ordinary push leaves both conditions false.
  publish-pypi:
    needs: release-please
    # `!cancelled()` keeps the manual hatch reachable when the
    # release-please job itself failed — the exact case it recovers from.
    if: >-
      ${{ !cancelled()
          && (needs.release-please.outputs.releases_created == 'true'
              || inputs.publish_ref != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      contents: write # upload SBOM + signatures to the GitHub release
      id-token: write # OIDC: Trusted Publishing, Sigstore, and provenance
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@v7
        with:
          # github.sha, not github.ref: a branch name resolves to main's tip
          # at job start, which may already be past the release commit.
          ref: ${{ inputs.publish_ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      # --- supply-chain evidence (docs/engineering/ci-gates.md) ---------
      # SLSA build provenance for the exact artifacts published to PyPI.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # SPDX SBOM of the built distribution, attached to the GitHub release.
      # output-file must land in an EXISTING directory — the action does not
      # create the parent and fails ENOENT (it did, on the v0.3.10 publish).
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: coding-os-sbom.spdx.json
          output-file: coding-os-sbom.spdx.json
      # Sigstore keyless signatures for wheel + sdist (bundles land in dist/).
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: dist/*.whl dist/*.tar.gz
      - name: Attach SBOM + signature bundles to the GitHub release
        # The trigger is a push (not a release event), so auto-upload paths
        # in the actions above don't fire — attach the evidence explicitly.
        if: needs.release-please.outputs.tag_name != '' || inputs.publish_ref != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.publish_ref || needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" coding-os-sbom.spdx.json --clobber
          gh release upload "$TAG" dist/*.sigstore.json --clobber
      # ------------------------------------------------------------------
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
