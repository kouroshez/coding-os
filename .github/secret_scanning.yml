# Secret-scanning exclusions — detector test fixtures.
#
# This repository SHIPS a secret detector (`src/core/hooks/block-secrets.sh`).
# Testing a detector requires feeding it credential-shaped input, so a handful
# of files deliberately contain strings that LOOK like AWS / GitHub / Stripe /
# Anthropic / Slack credentials. None of them is a credential. Every fixture is
# unusable by construction, using one of three techniques:
#
#   1. Composed at run time, never stored as a literal — e.g.
#      `"sk-ant-api03-" + "A1b2C3d4" * 11` in tests/test_block_secrets.py.
#      A scanner cannot match a string that does not exist in the tree.
#   2. Deliberately sub-threshold — the body is shorter than the vendor's real
#      key length, so it exercises our own pattern without being a valid shape.
#   3. A vendor's own published example — AWS, for instance, documents a
#      reserved access-key identifier ending in `EXAMPLE` that is permanently
#      invalid and exists only for documentation and tests.
#
# The rule, who it binds, and how it is enforced: SECURITY.md § Test fixtures
# for secret detection. It is machine-checked by
# tests/test_secret_fixture_policy.py, which fails the build if any tracked file
# gains a literal that would match a real vendor pattern at full length.
#
# Scope note: `paths-ignore` suppresses GitHub secret scanning for these paths,
# so the list is kept to detector fixtures and generated snapshots only — never
# whole directories of hand-authored code. Every commit is still scanned by
# `block-secrets.sh` (agent-side) and the git `pre-commit` hook (human-side),
# neither of which honours this file.
paths-ignore:
  # Detector fixtures — assert block-secrets.sh exits 2 on credential shapes.
  - "tests/test_block_secrets.py"
  - "tests/test_hooks_blocks.py"
  # Redaction fixtures — assert the sanitiser strips credentials from traces.
  - "src/core/thinking_os/tests/test_sanitizer.py"
  - "src/core/thinking_os/tests/test_session_summary.py"
  # Generated scaffold snapshots (`make golden-capture`). Never hand-authored:
  # they can only ever contain what src/templates/ and src/core/ already hold,
  # and those paths are scanned.
  - "tests/golden/**"
