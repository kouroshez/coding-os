# Dependabot — automated dependency update PRs.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# Grouping is deliberately wide: one PR per ecosystem per week. Ungrouped
# updates open a PR per package, which on a fresh repository arrives as a
# dozen at once and buries everything else.
version: 2
updates:
  # ---- Python ----
  # `uv`, not `pip`: the pip ecosystem edits pyproject.toml and leaves uv.lock
  # untouched, so every PR it opened died on ci.yml's `uv lock --check` (#58,
  # #59). The uv ecosystem updates both, which is the only shape that can pass
  # a gate this repo added precisely because release-please had the same gap.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  # ---- Node / Hub UI ----
  - package-ecosystem: npm
    directory: "/src/core/web/ui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]
      # eslint and @eslint/js share a peer range: bumping @eslint/js to 10
      # alone fails `npm ci` with ERESOLVE (#57). They move together or not
      # at all.
      eslint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "typescript-eslint"]
    ignore:
      # eslint 10 is blocked upstream, not by anything in this repo: every
      # published eslint-plugin-react (latest 7.37.5) peer-caps at `^9.7`, so
      # `npm ci` ERESOLVEs no matter how the group is arranged (#61). Grouping
      # cannot fix an upstream range. Delete both entries once
      # eslint-plugin-react declares `^10`; minor/patch keep flowing meanwhile.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]

  # ---- Docker base images (digest-pinned in Dockerfile) ----
  # Digest pins go stale silently — without this ecosystem the pin becomes a
  # frozen, unpatched base image, which is worse than the floating tag was.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "build(deps)"
    ignore:
      # The runtime interpreter must stay on the line CI actually tests
      # (3.10/3.11/3.12) and that uv.lock is resolved for. Left open, the first
      # run proposed python 3.12-slim -> 3.14-slim (#55): a green digest bump
      # that would have shipped an untested interpreter. Patch/minor still flow.
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # ---- GitHub Actions ----
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
