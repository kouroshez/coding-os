# Dependabot — automated dependency update PRs.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # ---- Python (pip ecosystem reads pyproject.toml) ----
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Batch low-risk dev-tooling bumps into one PR.
      dev-tooling:
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"
          - "types-*"

  # ---- Node / Hub UI ----
  - package-ecosystem: npm
    directory: "/src/core/web/ui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # React + types move together; batch them.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      vite-toolchain:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"

  # ---- GitHub Actions ----
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci(deps)"
