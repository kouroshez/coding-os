# Dependabot — automated dependency update PRs.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# Grouping is deliberately wide: one PR per ecosystem per week. Ungrouped
# updates open a PR per package, which on a fresh repository arrives as a
# dozen at once and buries everything else.
version: 2
updates:
  # ---- Python (pip ecosystem reads pyproject.toml) ----
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  # ---- Node / Hub UI ----
  - package-ecosystem: npm
    directory: "/src/core/web/ui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]

  # ---- GitHub Actions ----
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
