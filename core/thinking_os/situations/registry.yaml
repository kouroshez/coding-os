situations:
  - id: incident-response
    trigger_signals: [production_down, pager_fired, severity_s0, severity_s1]
    precondition: "service must be restored before root-cause work begins"
    persona_overlay: devops
    dispatch_chain:
      - action: mitigate
        description: "rollback / feature-flag / scale-up to restore service"
      - action: communicate
        description: "notify stakeholders of incident and ETA"
      - dispatch: F7
        description: "debug root cause"
      - dispatch: F6
        description: "regression testing before re-deploy"
      - action: post_mortem
        description: "structured writeup via F4 template"
      - dispatch: F10
        description: "update monitoring so next incident is caught earlier"

  - id: onboarding
    trigger_signals: [new_team_member, first_time_contributor]
    persona_overlay: junior-dev
    dispatch_chain:
      - action: read_f4_outputs
        description: "read existing docs produced by F4"
      - action: read_f3_adrs
        description: "read ADRs from F3 outputs"
      - dispatch: F5
        description: "small scoped implementation task"
      - dispatch: F6
        description: "review role — understand test patterns"
      - dispatch: F2
        description: "graduate to problem analysis"

  - id: scope-change
    trigger_signals: [requirements_changed, client_pivot]
    persona_overlay: tech-lead
    dispatch_chain:
      - dispatch: F2
        description: "re-evaluate scope boundary (step 1 only)"
        mode: partial
      - action: traceability_check
        description: "top-bottom audit before modifying anything"
      - dispatch: F2
        description: "update affected scenarios and decision tables"
      - dispatch: F3
        description: "update architecture if affected"
      - dispatch: F4
        description: "update docs to reflect new scope"

  - id: external-integration
    trigger_signals: [new_third_party_api, payment_gateway, auth_provider]
    persona_overlay: senior-backend
    dispatch_chain:
      - dispatch: F1
        description: "mini research — pricing, SDKs, rate limits, SLAs"
      - dispatch: F2
        description: "integration-specific scenarios and actor map"
      - dispatch: F3
        description: "API contract + circuit breaker design"
      - dispatch: F5
        description: "implement integration"
      - dispatch: F6
        description: "integration tests + contract tests"
      - dispatch: F8
        description: "security implications of new dependency"

  - id: design-review
    trigger_signals: [pre_implementation_review_requested]
    precondition: "F3 and F4 must have produced outputs for this task"
    persona_overlay: tech-lead
    dispatch_chain:
      - action: verify_f2_scenarios_satisfied
        description: "check every F2 scenario is addressed in F3"
      - action: verify_adr_tradeoffs_documented
        description: "check all major decisions have ADRs"
      - action: approval_gate
        description: "block F5 dispatch until reviewer approves"

  - id: existing-project-takeover
    trigger_signals: [legacy_codebase, inherited_repo, no_docs]
    persona_overlay: legacy-maintainer
    dispatch_chain:
      - dispatch: F2
        description: "reverse-engineer problem definition, actors, data model"
        mode: reverse
      - dispatch: F6
        description: "characterization tests before changing anything"
        mode: stabilize
      - dispatch: F4
        description: "document what was discovered"
      - dispatch: F5
        description: "enter standard dev loop"
      - dispatch: F6
        description: "regression tests for changes"
      - dispatch: F11
        description: "prioritize technical debt items"
      - dispatch: F3
        description: "evaluate architecture evolution options"
