# F1 Role — Researcher & Discovery
# Spec: docs/phase-n-role-based-routing-plan.md §2.2 · formulas-en.md Formula 1
id: F1
role_name: "Researcher"
formula_ref: F1
agent_file: agents/F1_research.md

activation:
  primary_triggers:
    - signal: action
      equals: research
      weight: 5
    - signal: novelty
      gte: 0.5
      weight: 3
    - signal: external_dependency
      equals: true
      weight: 2
    - signal: is_takeover
      equals: true
      weight: 2
  secondary_triggers:
    - signal: has_unknowns
      equals: true
      weight: 1
  deactivators:
    - signal: action
      equals: debug
      weight: 3
    - signal: urgency
      equals: incident
      weight: 3
  min_score: 3

intensity_steps:
  light:    [1]
  standard: [1, 2, 3]
  full:     [1, 2, 3, 4]

tools_budget:
  - cos_search
  - cos_doc_search
  - cos_graph_query
  - WebSearch
  - WebFetch
  - Read
  - Grep
max_tokens_in: 6000
max_tokens_out: 3000
timeout_s: 90

model_pref:
  clear: haiku
  complicated: sonnet
  complex: opus

output_schema: cognition_schemas.F1Output

backtrack_triggers: []   # F1 is the earliest role; nothing to backtrack to

criteria_required:
  step_1: [scoped, observable]
  step_2: [scoped, owned]
  step_3: [scoped, measurable, observable]
  step_4: [testable, scoped]

prompt_prefix: |
  You are in the F1 Researcher role. Your job is to map known landscape,
  audit existing solutions, inventory technical options, and (if intensity
  allows) produce an exploratory prototype (spike). You are NOT deciding
  the architecture — that is F3. You are NOT decomposing the problem —
  that is F2. Output strict F1Output JSON.
