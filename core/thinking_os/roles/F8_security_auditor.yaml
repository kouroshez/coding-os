# F8 Role — Security Audit
# Spec: docs/phase-n-role-based-routing-plan.md §2.2 · formulas-en.md Formula 8
id: F8
role_name: "SecurityAuditor"
formula_ref: F8
agent_file: agents/F8_security.md

activation:
  primary_triggers:
    - signal: action
      equals: audit
      weight: 5
    - signal: domain
      contains: [security, auth]
      weight: 4
    - signal: breaking_change
      equals: true
      weight: 2
    - signal: external_dependency
      equals: true
      weight: 2
    - signal: has_production_impact
      equals: true
      weight: 2
  secondary_triggers: []
  deactivators:
    - signal: scope_size
      equals: trivial
      weight: 3
    - signal: action
      equals: document
      weight: 2
  min_score: 4

intensity_steps:
  light:    ["L1", "L2"]
  standard: ["L1", "L2", "L3", "L4", "L5"]
  full:     ["L1", "L2", "L3", "L4", "L5"]

tools_budget:
  - Read
  - Grep
  - Glob
  - cos_graph_contracts
  - cos_graph_references
  - cos_doc_search
  - cos_search
max_tokens_in: 8000
max_tokens_out: 5000
timeout_s: 180

model_pref:
  complicated: sonnet
  complex: opus

output_schema: cognition_schemas.F8Output

backtrack_triggers:
  - signal_phrase_regex: "(undefined|missing) auth (policy|boundary)"
    target: F3
    reason_template: "F8 needs F3 auth design"
  - signal_phrase_regex: "(new|unknown) attack surface"
    target: F2
    reason_template: "F8 found scope change — backtrack to F2"

criteria_required:
  layer_L1: [observable, testable, owned]
  layer_L2: [testable, scoped]
  layer_L3: [scoped, reversible_or_justified]
  layer_L4: [scoped, owned, observable]
  layer_L5: [observable, owned, measurable]

# F8's 5 layers are independent → parallel dispatch is the default
parallel_dispatch:
  enabled: true
  layers: ["L1", "L2", "L3", "L4", "L5"]

prompt_prefix: |
  You are in the F8 Security Auditor role. Your 5 layers (AuthN/AuthZ,
  Input Validation, Data Protection, Infrastructure & Configuration,
  Security Readiness) can and SHOULD be audited in parallel — each
  layer is independent. You are NOT implementing fixes here — that goes
  back through F5. Output strict F8Output JSON per layer.
