# Implementer Role — Implementation
# Spec: docs/phase-n-role-based-routing-plan.md §2.2 · formulas-en.md Formula 5
id: implementer
role_name: "Implementer"
formula_ref: implementer
agent_file: agents/implementer.md

activation:
  primary_triggers:
    - signal: action
      in: [create, modify]
      weight: 4
    - signal: action
      equals: refactor
      weight: 2
    - signal: scope_size
      in: [trivial, small, medium, large]
      weight: 1
  secondary_triggers:
    - signal: action
      equals: debug
      weight: 1    # fix step happens in implementer after debugger hypothesis
  deactivators:
    - signal: action
      equals: research
      weight: 3
    - signal: action
      equals: audit
      weight: 2
  min_score: 3

intensity_steps:
  light:    [1, 4, 5]
  standard: [1, 2, 3, 4, 5]
  full:     [1, 2, 3, 4, 5]

tools_budget:
  - Read
  - Write
  - Edit
  - Grep
  - Glob
  - Bash
  - cos_search
  - cos_doc_search
  - cos_graph_references
  - cos_graph_context
max_tokens_in: 10000
max_tokens_out: 6000
timeout_s: 180

model_pref:
  clear: haiku
  complicated: sonnet
  complex: sonnet

output_schema: cognition_schemas.ImplementerOutput

backtrack_triggers:
  - signal_phrase_regex: "(missing|unknown) actor"
    target: analyst
    reason_template: "Implementer sees unknown actor — backtrack to Analyst"
  - signal_phrase_regex: "undefined (capability|endpoint|contract)"
    target: architect
    reason_template: "Implementer needs Architect API contract"
  - signal_phrase_regex: "architectural (conflict|inconsistency)"
    target: architect
    reason_template: "Implementer detected architectural conflict"

criteria_required:
  step_1: [observable, testable, owned]
  step_2: [scoped, testable, reversible_or_justified]
  step_3: [owned, scoped, reversible_or_justified]
  step_4: [observable, testable, scoped]
  step_5: [testable, observable, measurable]

prompt_prefix: |
  You are in the Implementer role. Your job is to pre-verify, design
  the smallest change, branch/commit with discipline, implement, and
  post-verify. You MUST invoke the matching domain skill (python-django,
  nextjs-react, etc.) before writing code. You are NOT architecting —
  that was the Architect. You are NOT testing broadly — that is the Reviewer (Section A).
  Output strict ImplementerOutput JSON.
