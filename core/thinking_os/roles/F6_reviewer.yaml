# F6 Role — Testing · Code Review · Performance
# Spec: docs/phase-n-role-based-routing-plan.md §2.2 · formulas-en.md Formula 6
id: F6
role_name: "Reviewer"
formula_ref: F6
agent_file: agents/F6_test_review.md

activation:
  primary_triggers:
    - signal: action
      equals: review
      weight: 5
    - signal: action
      in: [create, modify, refactor, debug]
      weight: 3    # F6 is mandatory post-F5
  secondary_triggers: []
  deactivators:
    - signal: action
      equals: document
      weight: 3
    - signal: scope_size
      equals: trivial
      weight: 1
  min_score: 3

intensity_steps:
  light:    ["A.L1", "A.L2", "B.readability"]
  standard: ["A.L1", "A.L2", "A.L3", "A.L4", "B.readability", "B.correctness", "B.maintainability", "C.backend"]
  full:     ["A.L1", "A.L2", "A.L3", "A.L4", "B.readability", "B.correctness", "B.maintainability", "C.backend", "C.frontend"]

tools_budget:
  - Read
  - Grep
  - Glob
  - Bash
  - cos_search
  - cos_graph_references
  - cos_graph_trace
max_tokens_in: 8000
max_tokens_out: 5000
timeout_s: 180

model_pref:
  clear: haiku
  complicated: sonnet
  complex: sonnet

output_schema: cognition_schemas.F6Output

backtrack_triggers:
  - signal_phrase_regex: "(new|uncovered) edge case"
    target: F2
    reason_template: "F6 found edge case not in F2 decision table"
  - signal_phrase_regex: "(contract|API) (mismatch|violation)"
    target: F3
    reason_template: "F6 detected API contract mismatch"
  - signal_phrase_regex: "implementation (bug|defect)"
    target: F5
    reason_template: "F6 found implementation defect — return to F5"

criteria_required:
  step_unit:    [testable, observable]
  step_integ:   [testable, observable, scoped]
  step_e2e:     [testable, observable, connected_to_user_value]
  step_llm:     [testable, measurable]
  step_review:  [observable, owned]
  step_perf:    [measurable, observable]

# F6 layers are parallelizable (reference: plan §2.5 parallel dispatch)
parallel_dispatch:
  enabled: true
  layers: ["A.L1", "A.L2", "A.L3", "A.L4", "C.backend", "C.frontend"]

prompt_prefix: |
  You are in the F6 Reviewer role. Your job is Section A (unit +
  integration + e2e + LLM tests), Section B (readability + correctness
  + maintainability review), and Section C (backend/frontend
  performance). Author-reviewer separation applies: if you implemented
  it, another agent must review. Output strict F6Output JSON.
