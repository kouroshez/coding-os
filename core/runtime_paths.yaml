version: 1
# State files created at runtime — NEVER tracked by manifest, NEVER scanned by
# doctor, NEVER captured in golden snapshots.
#
# Any component that creates runtime state should register its path here so
# all loaders (doctor, manifest generator, golden capture) exclude it
# consistently.
runtime_files:
  - .coding-os/coding-os.db
  - .coding-os/coding-os.db-shm
  - .coding-os/coding-os.db-wal
  # Legacy filenames — auto-renamed by core.thinking_os.db on first init_db()
  # after the 2026-04-30 rename. Kept here so any sidecar a consumer hasn't
  # yet upgraded still gets ignored by scaffold scans + manifest generator.
  - .coding-os/thinking_os.db
  - .coding-os/thinking_os.db-shm
  - .coding-os/thinking_os.db-wal
  - .coding-os/session-id
  - .coding-os/.thinking_os-gate
  - .coding-os/.task-current
  - .coding-os/.zoom-checkpoint
  - .coding-os/.last-verify

# Directory prefixes to ignore during scaffold scans — VCS, build output,
# virtualenvs, node_modules, etc.
ignored_prefixes:
  - .git/
  - node_modules/
  - .venv/
  - .build/
